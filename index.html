<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cerquem bé! · Competència digital</title>
<style>
:root{color-scheme:light;--c:#0f9d9a;--cl:#dff6f5;--ink:#1f2a37;--mut:#5b6776;--bg:#f6f8fb;--ok:#1b8a3a;--okl:#e3f6e8;--ko:#c0392b;--kol:#fdecea;--warn:#b7791f;--warnl:#fff4d6}
body[data-c="inicial"]{--c:#e8830c;--cl:#fff0dc}
body[data-c="mitja"]{--c:#0f9d9a;--cl:#dff6f5}
body[data-c="superior"]{--c:#6a4fc7;--cl:#ece8fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:19px;line-height:1.45}
#app{max-width:920px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:34px;margin:.2em 0}h2{font-size:26px;margin:.3em 0}h3{font-size:21px;margin:.4em 0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.top .grow{flex:1}
.chip{display:inline-block;background:var(--cl);color:var(--ink);border-radius:20px;padding:3px 12px;font-size:15px;font-weight:700}
.card{background:#fff;border:2px solid #e3e8ef;border-radius:18px;padding:18px 20px;margin:12px 0;box-shadow:0 2px 0 #e3e8ef}
.card.hl{border-color:var(--c)}
.btn{display:inline-block;background:var(--c);color:#fff;border:0;border-radius:14px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.sec{background:#fff;color:var(--ink);border:2px solid #cfd6df;box-shadow:0 3px 0 #dfe4ea}
.btn.big{font-size:22px;padding:16px 30px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bubble{background:#fff;border:2px solid var(--c);border-radius:18px;padding:10px 16px;position:relative;flex:1}
label{display:block;font-weight:700;margin:12px 0 4px}
input[type=text],textarea,select{width:100%;font:inherit;padding:10px 12px;border:2px solid #cfd6df;border-radius:12px;background:#fff;color:#1f2a37;-webkit-text-fill-color:#1f2a37;caret-color:#1f2a37}
input::placeholder,textarea::placeholder{color:#7a8594;-webkit-text-fill-color:#7a8594;opacity:1}
option{background:#fff;color:#1f2a37}
button{color:inherit}
input:focus,textarea:focus,select:focus{outline:3px solid var(--cl);border-color:var(--c)}
.cicles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cc{border:3px solid #dbe1e8;border-radius:16px;padding:12px;background:#fff;cursor:pointer;text-align:center;font:inherit;color:var(--ink)}
.cc b{display:block;font-size:20px}.cc small{color:var(--mut);display:block;font-size:14px;margin-top:4px}
.cc.sel{border-color:var(--c);background:var(--cl)}
.cc[data-v=inicial].sel{border-color:#e8830c;background:#fff0dc}.cc[data-v=superior].sel{border-color:#6a4fc7;background:#ece8fb}
.steps{display:flex;gap:6px;margin:8px 0 14px;flex-wrap:wrap}
.stp{flex:1;min-width:110px;text-align:center;border-radius:12px;padding:6px 4px;font-size:14px;font-weight:700;background:#e9edf2;color:var(--mut);cursor:pointer;border:0;font-family:inherit}
.stp.on{background:var(--c);color:#fff}.stp.done{background:var(--cl);color:var(--ink)}
.toy{border:3px solid #9aa6b5;border-radius:14px;overflow:hidden;background:#fff;margin:10px 0;color:var(--ink)}
.toy .bar{background:#e4e9f0;padding:8px 10px;display:flex;gap:8px;align-items:center;font-size:15px;flex-wrap:wrap}
.toy .dots span{display:inline-block;width:10px;height:10px;border-radius:50%;background:#aab4c2;margin-right:3px}
.toy .url{flex:1;background:#fff;border-radius:20px;padding:4px 14px;border:1px solid #c5cdd8;color:var(--mut);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:120px}
.toy .body{padding:14px 18px}
.toy .b{cursor:pointer;padding:5px 12px;border-radius:10px;background:#fff;border:1px solid #c5cdd8;font-weight:700;font-size:20px}
.toy .b:hover,.toy .url[data-act]:hover,.lnk:hover{outline:3px solid var(--cl)}
.lnk{color:#1a5fd0;text-decoration:underline;cursor:pointer}
.locked{pointer-events:none}
.tok{display:inline-block;margin:4px;padding:6px 12px;border:2px solid #cfd6df;border-radius:12px;background:#fff;color:var(--ink);font:inherit;cursor:pointer}
.tok:disabled{color:var(--ink)}
.tok.sel{background:var(--cl);border-color:var(--c);font-weight:700}
.tok.ok{background:var(--okl);border-color:var(--ok)}.tok.ko{background:var(--kol);border-color:var(--ko)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 16px;border:2px solid #cfd6df;border-radius:14px;background:#fff;font:inherit;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--c)}.opt.ok{background:var(--okl);border-color:var(--ok)}.opt.ko{background:var(--kol);border-color:var(--ko);opacity:.75}
.opt.ord.sel{background:var(--cl);border-color:var(--c)}
.opt .n{display:inline-block;min-width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;text-align:center;font-weight:700;margin-right:8px;line-height:28px}
.fb{border-radius:12px;padding:10px 14px;margin:10px 0}.fb.ok{background:var(--okl)}.fb.ko{background:var(--kol)}.fb.hint{background:var(--warnl)}
kbd{display:inline-block;border:2px solid #9aa6b5;border-bottom-width:4px;border-radius:8px;background:#f4f6f9;padding:0 9px;font:700 .9em "Trebuchet MS",system-ui,sans-serif;color:var(--ink);line-height:1.5}
.logos{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0}
.lg{text-align:center;width:96px;font-size:14px}
.logo{width:56px;height:56px;object-fit:contain;display:block;margin:0 auto 4px;vertical-align:middle}
.logo.wide{width:120px;height:56px}
.lg.wide{width:140px}
.logo.sm.wide{width:auto;height:30px}
.logo.sm{width:30px;height:30px;display:inline-block;margin:0 8px 0 0}
.logo.ph{border:2px dashed #aab4c2;border-radius:12px;background:#f1f4f8;color:#7a8594;font-weight:700;font-size:11px;line-height:52px;text-align:center}
.logo.sm.ph{line-height:26px;font-size:9px}
.emo{display:flex;gap:10px;flex-wrap:wrap}
.sem{display:flex;align-items:center;gap:8px;border:3px solid #cfd6df;background:#fff;color:var(--ink);border-radius:30px;padding:6px 16px 6px 8px;font:inherit;font-weight:700;cursor:pointer}
.sem i{display:inline-block;width:30px;height:30px;border-radius:50%;opacity:.45;border:3px solid rgba(0,0,0,.25)}
.sem.g i{background:#2e9e4f}.sem.y i{background:#f2c200}.sem.r i{background:#d93a2f}
.sem.on{border-color:var(--ink);background:#f3f6fa}.sem.on i{opacity:1}
.sp{background:none;border:0;cursor:pointer;font-size:22px;padding:0 4px}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #e3e8ef;padding:8px 6px;text-align:left;vertical-align:top;font-size:17px}
.st{font-weight:700;white-space:nowrap}.st.assolit{color:var(--ok)}.st.dominat{color:#8a5a00}.st.proces{color:var(--warn)}.st.no{color:var(--mut)}
.prog{height:10px;background:#e3e8ef;border-radius:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--c)}
.back{background:var(--warnl);border:2px solid #f0c75c;border-radius:14px;padding:10px 14px;margin:10px 0}

.nivells{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.nv{width:100%;min-height:96px;border:3px solid #dbe1e8;border-radius:18px;padding:18px 14px;background:#fff;text-align:center;font:inherit;color:var(--ink);cursor:pointer;text-decoration:none;display:block}
.nv b{display:block;font-size:22px}.nv small{display:block;color:var(--mut);font-size:15px;margin-top:4px}
.nv:not([disabled]):hover{border-color:var(--c);background:var(--cl)}
.nv[disabled]{opacity:.55;cursor:not-allowed;background:#f1f4f8}
.nv .soon{display:table;margin:8px auto 0;background:#fff4d6;color:#7a5300;border-radius:20px;padding:2px 12px;font-size:14px;font-weight:700}
.cdgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.contacte textarea{min-height:120px;resize:vertical}
@media(max-width:700px){.nivells,.cdgrid{grid-template-columns:1fr}}
.fmtbar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;justify-content:flex-end;background:#fff;border:2px solid #dbe1e8;border-radius:14px;padding:6px 12px;margin-bottom:12px;font-size:16px}
.fmtbar label{display:inline-flex;align-items:center;gap:6px;margin:0;font-weight:700}
.fmtbar select{width:auto;padding:4px 8px}
.fmtbar input[type=checkbox]{width:22px;height:22px}
#app.maj,#app.maj input,#app.maj select,#app.maj textarea,#app.maj button,#app.maj option{text-transform:uppercase}
.prof{margin:8px 0;font-size:15px;color:var(--mut)}
.prof summary{cursor:pointer;font-weight:700;display:inline-block;padding:3px 12px;border-radius:20px;background:#fff8e6;border:1px solid #f0dca0;color:#7a5300;font-size:14px}
.prof[open] summary{margin-bottom:6px}
.prof p{margin:6px 0;line-height:1.45;max-width:72ch}
.fig{background:#fff;border:2px solid #dbe1e8;border-radius:16px;padding:10px 12px;margin:12px 0}
.fig svg{width:100%;height:auto;display:block}
.fig .leg{margin:8px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:17px}
.fig .leg li{display:flex;gap:8px;align-items:flex-start}
.fig .n{flex:none;width:24px;height:24px;border-radius:50%;background:#e8830c;color:#fff;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.kb [data-act]{cursor:pointer}
@media(max-width:700px){.fig .leg{grid-template-columns:1fr}}
.nota{background:#fff8e6;border:2px solid #f0dca0;border-radius:14px;padding:10px 14px;margin:10px 0}
.qs{padding-left:26px}.qs li{margin:10px 0}
.chk{display:flex;flex-wrap:wrap;gap:8px 18px;margin:4px 0}.chk label{display:inline-flex;align-items:center;gap:8px;margin:0;font-weight:600}.chk input{width:22px;height:22px}
a.lg{color:inherit;text-decoration:none;border:2px solid #dbe1e8;border-radius:14px;padding:8px;background:#fff;display:block}
a.lg:hover{border-color:var(--c);background:var(--cl)}
.foot{margin-top:28px;font-size:13px;color:var(--mut)}
#peu{max-width:920px;margin:0 auto;padding:14px 16px 28px;border-top:2px solid #e3e8ef;font-size:14px;color:var(--mut);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
#peu .logos-m{display:flex;gap:14px;align-items:center}
#peu .logos-m img{height:44px;width:auto}
#peu .finan{width:100%;max-width:720px;height:auto;display:block}
#peu a{color:var(--c);font-weight:700}
@media print{#peu{border:0}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.cicles,.grid2{grid-template-columns:1fr}}
@media print{.noprint{display:none!important}body{background:#fff}}

.lic{width:100%;border-collapse:collapse;margin:8px 0}.lic th,.lic td{border:1px solid #dbe1e8;padding:6px 8px;text-align:left;font-size:16px;vertical-align:top}.lic th{background:#f1f4f8}
.cols{align-items:end;display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.cols{grid-template-columns:1fr}}
.resp{width:100%}.resp td,.resp th{vertical-align:top}

/* Barra de navegació */
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg);padding:8px 0;margin:0 0 10px;border-bottom:2px solid #dbe1e8}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;list-style:none;margin:0;padding:0;flex:1;font-size:17px}
.crumbs li+li::before{content:'›';margin:0 6px;color:var(--mut);font-weight:700}
.crumb{background:none;border:0;color:var(--c);font:inherit;font-weight:700;padding:6px 4px;cursor:pointer;border-radius:8px;text-decoration:underline;text-underline-offset:3px}
.crumb:hover{background:var(--cl)}
.crumbs .cur{font-weight:800;padding:6px 4px}
.navb{display:flex;gap:8px}
.nav .btn{padding:6px 14px;font-size:16px}
.nav .btn.on{background:var(--c);color:#fff;border-color:var(--c)}
@media(max-width:700px){.crumbs li:last-child::before{content:none}.crumbs li:not(:nth-last-child(-n+2)){display:none}.crumbs li:nth-last-child(2)::before{content:none}.crumbs li:nth-last-child(2) .crumb::before{content:'‹ '}}
@media print{.nav{display:none}}
</style>
</head>

  {t:'Qui ens ho diu?',h:`Quan llegim una cosa, ens preguntem: <b>qui ens ho diu?</b><br>Un <b>llibre de la biblioteca</b> posa qui l’ha escrit i de quin any és.<br>Les pàgines d’Internet també ho poden dir.`},
  {t:'Tres senyals de confiança',h:`Una pàgina de <b>confiança</b> té aquests senyals:<br>1. Diu <b>qui l’ha feta</b> (l’<b>autoria</b>): una escola, un museu, un diari…<br>2. Diu <b>de quan és</b> (la data).<br>3. Altres pàgines diuen <b>el mateix</b>.<br>Si és una pàgina <b>sense autoria</b>, <b>vigilem</b>! 👀`},
  {t:'Una pàgina que ens podem creure',h:`<b>Fiable</b> vol dir que ens la podem creure.<br>Per saber coses de la Lluna, ens fiem més d’una pàgina d’un <b>museu de ciències</b> que d’una pàgina <b>sense autoria</b>.`}],
 items:[
  ch('F1','fiable','Una pàgina de <b>confiança</b> és una pàgina que…',['té molts colors 🎨','diu qui l’ha feta i de quan és','té moltes fotos 🖼️'],1,'Pensa en el llibre de la biblioteca.','Una pàgina de confiança diu qui l’ha feta i de quan és.'),
  ch('F2','fiable','Voleu saber coses de l’espai 🚀. De quina pàgina us fieu més?',['De la d’un museu de ciències','De la que no té autoria','D’un anunci'],0,'Qui en sap, d’espai? I diu qui és?','Un museu de ciències en sap d’espai i diu qui és. Per això ens en podem fiar.'),
  ch('F3','fiable','Quina pàgina és <b>més fiable</b>?',[`La de dalt: té autor i data`,`La de baix: no té autor ni data`],0,'Mira si diu qui l’ha fet.','La pàgina que diu qui l’ha fet i de quan és, és més fiable.',{html:pageBox(pg('museu-exemple.exemple/lluna','La Lluna','Equip del Museu','2024','Museu de ciències'))+pageBox(pg('pagina-exemple.exemple/lluna','LLUNA!!!','No diu','No diu','No ho sabem'))}),
  ch('F4','fiable','Una pàgina <b>sense autoria</b>. Què fem?',['Ens la creiem igualment','No fem res','Demanem ajuda o busquem una altra'],2,'Si no sabem qui l’ha feta, podem demanar ajuda.','Una pàgina sense autoria no diu qui l’ha feta. Demanem ajuda al professorat o busquem una altra pàgina.'),
  ch('F5','fiable','Quan un llibre de la biblioteca posa <b>l’any</b>, ens diu…',['quant costa','de quin color és','de quan és la informació'],2,'La data ens diu quan es va fer.','L’any ens diu de quan és la informació.')],
 sabers:{fiable:{realDone:req(['qui1','data1','qui2','data2','creiem','perque'])}},
 real:{blocks:[
   {h:'<b>1.</b> Cerqueu el tema de la investigació i <b>obriu dues pàgines</b> diferents.',search:true,fields:[]},
   {h:'<b>2. Pàgina 1.</b> Mireu qui l’ha feta i si diu de quan és.',fields:['qui1','data1']},
   {h:'<b>3. Pàgina 2.</b> Feu el mateix amb l’altra pàgina.',fields:['qui2','data2']},
   {h:'<b>4.</b> Compareu les dues pàgines.',fields:['creiem','perque']}],
  fields:[{k:'qui1',type:'select',label:'Qui l’ha feta?',opts:['Una escola','Un museu','Un diari','Una botiga o empresa','No ho diu']},
   {k:'data1',type:'select',label:'Diu de quan és?',opts:['Sí','No']},
   {k:'qui2',type:'select',label:'Qui l’ha feta?',opts:['Una escola','Un museu','Un diari','Una botiga o empresa','No ho diu']},
   {k:'data2',type:'select',label:'Diu de quan és?',opts:['Sí','No']},
   {k:'creiem',type:'select',label:'Quina pàgina ens creiem més?',opts:['La pàgina 1','La pàgina 2','Igual']},
   {k:'perque',type:'select',label:'Per què?',opts:['Perquè diu qui l’ha feta i de quan és','Perquè té més fotos','Perquè surt la primera'],ok:'Perquè diu qui l’ha feta i de quan és'}]}},

/* ---------- CICLE MITJÀ ---------- */
'mitja-1':{
 puc:['Sé identificar les paraules clau per fer una cerca concreta a internet','Sé fer servir les cometes per buscar grups de paraules concretes'],
 lessons:[
  {t:'Què és una paraula clau?',h:`Una <b>paraula clau</b> és la paraula més important del que vols saber.<br>Al cercador no cal escriure frases llargues.<br><br>Pregunta: <i>«Què mengen els llops al bosc?»</i><br>Paraules clau: <b>llops</b> · <b>mengen</b>`},
  {t:'Més d’una paraula, o una frase exacta',h:`Pots posar <b>dues o tres paraules clau</b> juntes: <b>llops alimentació</b>.<br>Si vols que busqui unes paraules <b>justament juntes</b>, posa-les <b>entre cometes</b>. Les cometes són aquest símbol: <b>" "</b><br>Exemple: <b>"llop ibèric"</b>`},
  {t:'Si no surt el que busques',h:`Canvia una paraula o afegeix-ne una de més concreta.<br>Per exemple: <i>gos</i> surt de tot. <b>gos pastor</b> és més concret.`}],
 items:[
  {id:'A1',saber:'kw',type:'words',words:['Vull','saber','on','viuen','els','ossos','polars'],end:'',correct:['viuen','ossos','polars'],hint:'Busca l’animal, com és, i què vols saber d’ell.',expl:'Ossos, polars i viuen: diuen què busques. Les altres només omplen la frase.'},
  {id:'A2',saber:'kw',type:'words',words:['Quin','és','el','riu','més','llarg','de','Catalunya'],end:'?',correct:['riu','llarg','Catalunya'],hint:'Què busques? Com ha de ser? On?',expl:'Riu, llarg i Catalunya diuen què busques. Les altres paraules no ajuden al cercador.'},
  {id:'A3',saber:'kw',type:'words',words:['Què','menja','un','panda','gegant'],end:'?',correct:['menja','panda','gegant'],hint:'De quin animal vols saber coses? Què en vols saber?',expl:'Menja, panda i gegant diuen què busques. Les altres paraules no ajuden al cercador.'},
  ch('B1','kw','Vols saber quant pesa un elefant africà. <b>Quina cerca és millor?</b>',['Hola, voldria saber quant pesa un elefant africà si us plau','elefant africà pes','elefant'],1,'La millor cerca és curta però concreta.','«elefant africà pes» té només les paraules clau. «elefant» és massa general.'),
  ch('B2','kw','Vols buscar exactament <b>Castellers de Vilafranca</b>, amb les paraules juntes. <b>Què fas?</b>',['Les escric en majúscules','Les escric al revés','Les poso entre cometes ( " " )'],2,'Les cometes són aquest símbol " " i s’escriuen a cada costat de la frase.','Amb les cometes " " al voltant, com a "Castellers de Vilafranca", el cercador busca la frase exacta.'),
  ch('B3','kw','Has cercat <b>gos</b> i et surten milers de coses diferents. <b>Què fas?</b>',['Ho deixo així','Afegeixo una paraula més concreta (gos pastor)','Tanco el navegador'],1,'Cal ser més concret.','Afegir una paraula concreta fa la cerca més precisa.')],
 sabers:{kw:{realDone:req(['preg','k1','n1','k2','best','frase','cometes'])}},
 real:{blocks:[
   {h:'<b>1.</b> Penseu <b>una pregunta</b> sobre el vostre tema (per exemple: «Què mengen els llops?») i escriviu-la.',fields:['preg']},
   {h:'<b>2.</b> Trieu-ne <b>2 o 3 paraules clau</b> i feu la <b>primera cerca</b>.',search:true,fields:['k1','n1']},
   {h:'<b>3.</b> Feu una <b>segona cerca</b>: canvieu una paraula o afegiu-ne una de més concreta.',fields:['k2','best']},
   {h:'<b>4.</b> Cerqueu una <b>frase exacta entre cometes</b> (per exemple: "llop ibèric").',fields:['frase','cometes']}],
  fields:[{k:'preg',type:'text',label:'Quina és la vostra pregunta?'},
   {k:'k1',type:'text',label:'Paraules clau de la cerca 1',okFn:v=>{const n=v.trim().split(/\s+/).filter(Boolean).length;return n>=1&&n<=4}},
   {k:'n1',type:'select',label:'Els resultats parlen del vostre tema?',opts:['Sí, tots','Alguns','No']},
   {k:'k2',type:'text',label:'Paraules clau de la cerca 2',okFn:(v,r)=>{const n=v.trim().split(/\s+/).filter(Boolean).length;return n>=1&&n<=4&&v.trim().toLowerCase()!==(r.k1||'').trim().toLowerCase()}},
   {k:'best',type:'select',label:'Quina cerca ha donat millors resultats?',opts:['La 1','La 2','Igual']},
   {k:'frase',type:'text',label:'Quina frase heu posat entre cometes?',okFn:v=>/["“«].+["”»]/.test(v)},
   {k:'cometes',type:'select',label:'Les cometes han fet la cerca més precisa?',opts:['Sí','No','No ho sabem']}]}},

'mitja-2':{
 puc:['Sé que el navegador i el cercador no són la mateixa eina','Quan faig una cerca, identifico quan triar entre Tot, Imatges, Vídeos i Notícies'],
 lessons:[
  {t:'Navegador i cercador no són el mateix',h:`El <b>navegador</b> és el <b>programa</b> que fem servir per entrar a Internet:%%row:chrome,firefox,edge,safari%%El <b>cercador</b> és una <b>pàgina web</b> on escrivim què busquem:%%row:google,bing,duckduckgo,startpage%%Un cercador es pot obrir <b>des de qualsevol navegador</b>. Exemple: Google es pot fer servir amb Chrome, amb Firefox o amb Edge.`},
  {t:'El menú de cerques',h:`Sota la barra de cerca hi ha un menú: <b>Tot</b>, <b>Imatges</b>, <b>Vídeos</b> i <b>Notícies</b>. Cada opció et dona un tipus de resultat.<br>El micròfon 🎤 serveix per <b>cercar parlant</b>: es diu clar i amb les paraules clau.`,fig:()=>figMenu()}],
 items:[
  ch('M5','menu','Quin d’aquests és un <b>cercador</b>?',['[[logo:firefox]]','[[logo:google]]','[[logo:edge]]'],1,'El cercador és una pàgina on escrivim què busquem.','Google és un cercador. Firefox i Edge són navegadors.'),
  ch('M6','menu','Podem fer servir el cercador <b>Google</b> des del navegador <b>Firefox</b>?',['No: Google només funciona amb Chrome','Només si l’ordinador és nou','Sí: un cercador es pot obrir des de qualsevol navegador'],2,'El cercador és una pàgina web.','Els cercadors són pàgines web i s’obren des de qualsevol navegador.'),
  clic('M1','menu','Vols veure <b>fotos del bosc a la tardor</b>. Clica l’opció del menú.',TABS,'img','Vols veure fotos…','Imatges mostra fotos i dibuixos.'),
  clic('M2','menu','Vols veure <b>com es fa una dansa tradicional</b>, en moviment. Clica l’opció del menú.',TABS,'vid','En moviment: …','Vídeos mostra imatges en moviment.'),
  clic('M3','menu','Vols saber <b>què ha passat avui</b> a la teva ciutat. Clica l’opció del menú.',TABS,'not','Es parla d’avui.','Notícies mostra el que ha passat recentment.'),
  clic('M4','menu','Vols <b>cercar parlant</b>, sense escriure. Clica el botó.',TABS,'mic','Té forma de micròfon.','El micròfon 🎤 serveix per cercar parlant. Parla clar i digues només les paraules clau.')],
 sabers:{menu:{realDone:req(['cerc','img','vid','not','util','perque'])}},
 real:{blocks:[
   {h:'<b>1.</b> Obriu un cercador (cliqueu al logotip) i cerqueu el vostre tema. Recordeu: el cercador és una pàgina web i s’obre des del navegador.',links:['google','bing','duckduckgo','startpage'],fields:['cerc']},
   {h:'<b>2.</b> Trieu el menú <b>Imatges</b>.',fields:['img']},
   {h:'<b>3.</b> Trieu el menú <b>Vídeos</b>.',fields:['vid']},
   {h:'<b>4.</b> Trieu el menú <b>Notícies</b>.',fields:['not']},
   {h:'<b>5.</b> Compareu els quatre tipus de resultat (Tot, Imatges, Vídeos i Notícies).',fields:['util','perque']},
   {h:'<b>6.</b> Obriu el mateix cercador des d’un altre navegador instal·lat a l’ordinador.',fields:['altre']}],
  fields:[{k:'cerc',type:'select',label:'Quin cercador heu fet servir?',opts:['Google','Bing','DuckDuckGo','Startpage']},
   {k:'img',type:'text',label:'Què heu trobat a Imatges? (descriviu-ne una)'},
   {k:'vid',type:'text',label:'Quin és el títol del primer vídeo que surt?'},
   {k:'not',type:'text',label:'Quin és el títol de la notícia més recent?'},
   {k:'util',type:'select',label:'Quin menú ha donat resultats més útils per al vostre tema?',opts:['Tot','Imatges','Vídeos','Notícies']},
   {k:'perque',type:'text',label:'Per què?'},
   {k:'altre',type:'select',label:'Heu pogut obrir el mateix cercador des d’un altre navegador?',opts:['Sí, es pot','No ho hem provat'],ok:'Sí, es pot'}]}},

'mitja-3':{
 puc:['Sé què és un enllaç (hipervincle) i què passa quan clico sobre l’enllaç','Sé fer el text més gran o més petit amb el zoom del navegador'],
 lessons:[
  {t:'Hipervincles (enllaços)',h:`Un <b>hipervincle</b> és un text o una imatge que et porta a <b>una altra pàgina</b>.<br>Normalment és <span class="lnk">blau i subratllat</span>, i el cursor es converteix en una <b>mà</b> 👆.`},
  {t:'El zoom',h:`El <b>zoom</b> serveix per <b>ampliar o reduir</b> el contingut de la pantalla: el text i les imatges es veuen més grans o més petits, i així podem llegir millor.<br>Amb [[key:Ctrl]] i [[key:+]] s’<b>amplia</b>.<br>Amb [[key:Ctrl]] i [[key:−]] es fa <b>més petit</b>.<br>Amb [[key:Ctrl]] i [[key:0]] torna a la <b>mida normal</b>. El <b>0</b> és el <b>número zero</b>, no la lletra O.<br>El navegador mostra el <b>percentatge</b> (100 %, 125 %, 150 %…) a la barra d’adreces.`},
  {t:'On són les tecles del zoom?',h:`Mireu el teclat i trobeu les tres tecles.`,fig:()=>figZoom()}],
 items:[
  ch('H1','hiper','Què és un <b>hipervincle</b> (enllaç)?',['Un tipus de virus','Un text o una imatge que et porta a una altra pàgina','Un botó d’apagar'],1,'Et porta a una altra pàgina.','Un hipervincle és un text o una imatge que et porta a una altra pàgina.'),
  clic('H2','hiper','Clica l’<b>enllaç</b> de la pàgina.',LINKPAGE,'ok','Un enllaç sol ser blau i subratllat.','Els enllaços sol ser blaus i subratllats.'),
  ch('H3','hiper','Quan passes el ratolí per sobre d’un enllaç, el cursor es converteix en…',['una creu ✖','un rellotge ⌛','una mà 👆'],2,'Pensa en «assenyalar».','El cursor es converteix en una mà.'),
  ch('H4','hiper','Un enllaç et porta a una pàgina amb molts anuncis estranys. <b>Què fas?</b>',['Hi faig clic a tot','Torno enrere i trio un altre resultat','Ho deixo així'],1,'Mira si sembla de confiança.','Si una pàgina sembla estranya, es torna enrere i se’n tria una altra.'),
  ch('Z1','zoom','El text és <b>massa petit</b>. Què fas?',['[[key:Ctrl]] i [[key:+]]','[[key:Ctrl]] i [[key:−]]','[[key:Esc]]'],0,'Vols fer-lo més gran.','[[key:Ctrl]] i [[key:+]] amplia el text.'),
  ch('Z2','zoom','Vols <b>tornar a la mida normal</b>.',['[[key:Ctrl]] i [[key:+]]','[[key:Ctrl]] i [[key:C]]','[[key:Ctrl]] i [[key:0]] (número zero)'],2,'És un número: el zero, no la lletra O.','[[key:Ctrl]] i [[key:0]] (el número zero) torna a la mida normal.'),
  ch('Z3','zoom','Vols fer el text <b>més petit</b>.',['[[key:Ctrl]] i [[key:0]] (número zero)','[[key:Ctrl]] i [[key:+]]','[[key:Ctrl]] i [[key:−]]'],2,'Un signe de menys.','[[key:Ctrl]] i [[key:−]] fa el text més petit.'),
  ch('Z4','zoom','Per què serveix el zoom?',['Per fer el text i les imatges més grans o més petits','Per fer l’ordinador més ràpid','Per apagar-lo'],0,'Pensa en la mida del que veus.','El zoom serveix per fer el text i les imatges més grans o més petits, i així veure’ls millor.')],
 sabers:{hiper:{realDone:req(['enllac','tornat'])},zoom:{realDone:req(['zoom'])}},
 real:{blocks:[
   {h:'<b>1.</b> Cerqueu el vostre tema en un cercador. Cliqueu un <b>enllaç (hipervincle)</b> dels resultats de la cerca i feu-hi clic.',search:true,fields:[]},
   {h:'<b>2.</b> Quin enllaç heu seguit? <b>Copieu</b> l’adreça de la pàgina que heu obert i <b>enganxeu-la</b> aquí sota.<br><small>Com es copia i s’enganxa: 1) cliqueu a la barra d’adreces, a dalt del navegador, perquè quedi marcada; 2) premeu [[key:Ctrl]] i [[key:C]] per <b>copiar</b>; 3) torneu a aquesta pàgina, cliqueu a la caixa de sota i premeu [[key:Ctrl]] i [[key:V]] per <b>enganxar</b>.</small>',fields:['enllac']},
   {h:'<b>3.</b> Torneu a la pàgina de cerca amb el botó enrere <b>←</b>.',fields:['tornat']},
   {h:'<b>4.</b> Feu servir el zoom ([[key:Ctrl]] i [[key:+]] o [[key:Ctrl]] i [[key:−]]) i trieu la mida que us va millor per llegir. Mireu el percentatge a la barra d’adreces.',fields:['zoom']}],
  fields:[{k:'enllac',type:'text',label:'Enganxeu aquí l’enllaç que heu obert'},
   {k:'tornat',type:'select',label:'Heu tornat a la pàgina de cerca?',opts:['Sí','No'],ok:'Sí'},
   {k:'zoom',type:'select',label:'Quin percentatge (%) de zoom us va bé per llegir?',opts:['100 % (normal)','110 %','125 %','150 %','Més del 150 %']}]}},

'mitja-4':{
 puc:['Sé triar la font digital adequada (diccionari, enciclopèdia, llibre o premsa) segons el que necessito saber','Sé trobar l’autoria, la font i la data, i identificar la finalitat quan visito una pàgina web','Sé comparar pàgines web sobre el mateix tema i decidir quina informació és més fiable'],
 lessons:[
  {t:'Triar la font adequada',h:`Segons el que necessitem, hem de triar una font digital diferent.<br>📖 Un <b>diccionari digital</b> explica el significat, l’ortografia i els usos d’una paraula.<div class="logos"><a class="btn sec" href="https://dlc.iec.cat" target="_blank" rel="noopener">🔗 Diccionari de l’IEC</a> <a class="btn sec" href="https://www.diccionari.cat" target="_blank" rel="noopener">🔗 Diccionari.cat</a></div><br>🌍 Una <b>enciclopèdia digital</b> resumeix un tema amb dades, dates i explicacions (per exemple, la Viquipèdia).<div class="logos"><a class="btn sec" href="https://ca.wikipedia.org" target="_blank" rel="noopener">🔗 Viquipèdia</a> <a class="btn sec" href="https://www.enciclopedia.cat" target="_blank" rel="noopener">🔗 Enciclopèdia.cat</a></div><br>📚 Un <b>llibre digital</b> permet llegir una obra sencera a la pantalla.<div class="logos"><a class="btn sec" href="https://ca.wikisource.org" target="_blank" rel="noopener">🔗 Viquitexts (Wikisource)</a> <a class="btn sec" href="https://www.gutenberg.org" target="_blank" rel="noopener">🔗 Projecte Gutenberg</a></div><br>📰 La <b>premsa digital</b> explica fets que han passat fa poc.<div class="logos"><a class="btn sec" href="https://www.3cat.cat/3catinfo/" target="_blank" rel="noopener">🔗 3Cat Notícies</a> <a class="btn sec" href="https://www.ara.cat" target="_blank" rel="noopener">🔗 Ara</a> <a class="btn sec" href="https://www.vilaweb.cat" target="_blank" rel="noopener">🔗 VilaWeb</a> <a class="btn sec" href="https://www.elpuntavui.cat" target="_blank" rel="noopener">🔗 El Punt Avui</a> <a class="btn sec" href="https://directa.cat" target="_blank" rel="noopener">🔗 La Directa</a></div>`},
  {t:'Analitzar una pàgina: 4 preguntes',h:`Abans de fer servir una informació, ens preguntem:<br>1️⃣ <b>Qui ho ha escrit?</b> (autoria)<br>2️⃣ <b>D’on ve?</b> (font: museu, escola, institució…)<br>3️⃣ <b>De quan és?</b> (data d’actualització)<br>4️⃣ <b>Per què ho han escrit?</b> (finalitat: informar, ensenyar, vendre o convèncer)<br>Si falten pistes o la finalitat és vendre, hem de ser prudents.`},
  {t:'Comparar fonts',h:`Una sola pàgina no sempre és prou. Si <b>dues o tres pàgines fiables</b> expliquen el mateix, la informació és més segura.<br>Si una pàgina diu una cosa molt diferent de totes les altres, i a sobre no diu qui l’ha escrit, cal <b>desconfiar-ne</b>.<br>Si dues pàgines fiables donen dades diferents, ens quedem amb la <b>més recent</b>.`}],
 items:[
  ch('F1','fonts','Una nena vol saber què vol dir la paraula <b>gresol</b>, com s’escriu i en quines frases es pot fer servir. <b>Quina font digital l’ajudarà més?</b>',['Un llibre digital de contes','Un diccionari digital','La premsa digital'],1,'Busca la font que explica paraules.','Un diccionari digital explica el significat, l’ortografia i els usos de cada paraula.'),
  ch('F2','fonts','Per fer un treball sobre el <b>volcà de la Garrotxa</b> necessites un resum amb dades, dates i una explicació general. <b>Quina font tries primer?</b>',['Un diccionari digital','Una notícia d’avui','Una enciclopèdia digital'],2,'Necessites una visió general d’un tema.','Una enciclopèdia digital resumeix un tema amb dades, dates i explicacions.'),
  ch('F3','fonts','Vols saber què ha passat <b>aquest cap de setmana</b> a la teva ciutat. <b>Quina font és més adequada i per què?</b>',['Una enciclopèdia digital, perquè resumeix els temes','La premsa digital, perquè explica fets recents','Un diccionari digital, perquè explica paraules'],1,'Es tracta d’un fet molt recent.','La premsa digital explica fets que han passat fa poc.'),
  ch('F4','fonts','Vols llegir una <b>novel·la sencera</b> a la pantalla i poder canviar la mida de la lletra. <b>Què busques?</b>',['Un llibre digital','Una notícia','Un diccionari digital'],0,'Una obra sencera es llegeix en un …','Un llibre digital permet llegir una obra sencera a la pantalla.'),
  ch('V1','validesa','<b>Llegeix la pàgina.</b> D’on ve el color rosat dels flamencs? I pots fiar-te’n?',['Ve de l’aigua salada; no m’hi fio perquè no té data','Ve de la seva edat; m’hi fio perquè és una pàgina oficial','Ve dels pigments dels crustacis i les algues que mengen; m’hi fio perquè té autora, font i data'],2,'Llegeix el text i mira les quatre pistes.','El text explica que el color ve dels pigments dels crustacis i les algues, i la pàgina té autora, font i data.',{html:pageBox(pg('parc-delta.exemple/flamencs','Per què els flamencs són rosats?','Dra. Marta Roca, biòloga','Març de 2025','Web oficial del Parc Natural','El color rosat dels flamencs ve dels pigments que obtenen dels crustacis i de les algues de què s’alimenten. Els pollets neixen grisos.'))}),
  ch('V2','validesa','<b>Llegeix la pàgina.</b> Quina és la <b>finalitat</b> més probable d’aquesta pàgina?',['Informar sobre els flamencs amb dades científiques','Ensenyar com viuen els flamencs','Vendre un producte'],2,'Fixa’t en el preu i en «Compra ara».','La pàgina vol vendre una crema: no té autoria, ni data, i parla de preu i d’oferta.',{html:pageBox(pg('botiga-rosa.exemple/crema','Els flamencs són rosats gràcies al sol! Descobreix la crema que fa el mateix!','No consta','No consta','Botiga en línia','Només 19,90 €. Compra ara i obtindràs un color rosat espectacular. Oferta limitada!'))}),
  ch('V3','validesa','Les dues pàgines són fiables, però donen <b>xifres diferents</b>. Quina dada fas servir i per què?',['La de 2025, perquè és la més recent','La de 2012, perquè és més antiga i ja està comprovada','Les dues alhora, fent-ne la mitjana'],0,'Mira la data de cada pàgina.','Si dues pàgines fiables donen dades diferents, ens quedem amb la més recent.',{html:pageBox(pg('parc-delta.exemple/quants-2012','Quants flamencs hi ha al Delta?','Equip del Parc Natural','2012','Web oficial del parc','Al Delta hi ha uns 5.000 flamencs.'))+pageBox(pg('parc-delta.exemple/quants-2025','Quants flamencs hi ha al Delta?','Equip del Parc Natural','2025','Web oficial del parc','Al Delta hi ha uns 12.000 flamencs.'))}),
  ch('V4','validesa','Tres pàgines fiables diuen que els flamencs poden viure <b>uns 30 anys o més</b>. Una quarta pàgina, sense autor, diu que <b>només viuen 2 anys</b>. Què fas?',['Em quedo amb la quarta, perquè és la més sorprenent','Em quedo amb el que diuen les tres pàgines fiables i desconfio de la quarta','Faig la mitjana dels anys'],1,'Compara quantes fonts fiables hi ha d’un costat i de l’altre.','Si una pàgina diu una cosa molt diferent de les altres i no té autor, cal desconfiar-ne.')],

   {h:'<b>1. Diccionaris.</b> Busqueu la <b>paraula clau del vostre tema, en singular</b> (per exemple, <i>llop</i> i no <i>llops</i>), en aquests dos diccionaris:',web:[['Diccionari de l’IEC','https://dlc.iec.cat'],['Diccionari.cat','https://www.diccionari.cat']],fields:['dicIEC','dicCat','genere']},
   {h:'<b>2. Enciclopèdies.</b> Feu el mateix en aquestes dues enciclopèdies digitals:',web:[['Viquipèdia','https://ca.wikipedia.org'],['Enciclopèdia.cat','https://www.enciclopedia.cat']],fields:['viq','enc']},

   {h:'<b>4. Analitzem una pàgina qualsevol.</b> Cerqueu la paraula clau del vostre tema en un cercador i afegiu-hi una paraula que ajudi: <i>informació</i>, <i>què és</i> o <i>explicació</i> (per exemple: <i>llop informació</i>). Obriu <b>un resultat</b> que no sigui un diccionari ni una enciclopèdia i copieu-ne el títol o l’adreça.',search:true,fields:['titol']},

   {h:'<b>6.</b> Obriu un <b>segon resultat</b> sobre el mateix tema i compareu-lo amb el primer.',fields:['coinc']},
   {h:'<b>7.</b> <b>Decidiu</b> si us podeu fiar de la primera pàgina.',fields:['verdict','perque']}],
  fields:[{k:'dicIEC',type:'select',label:'Diccionari de l’IEC: quantes entrades (significats) té la paraula?',opts:['1','2','3','4 o més','No l’he trobada']},
   {k:'dicCat',type:'select',label:'Diccionari.cat: quantes entrades (significats) té la paraula?',opts:['1','2','3','4 o més','No l’he trobada']},
   {k:'genere',type:'select',label:'Quin és el gènere de la paraula que heu buscat?',opts:['Masculí','Femení','Masculí i femení','No té gènere (és un verb, un adjectiu…)']},
   {k:'viq',type:'select',label:'Viquipèdia: hi ha una pàgina sobre el vostre tema?',opts:['Sí','No']},
   {k:'enc',type:'select',label:'Enciclopèdia.cat: hi ha una pàgina sobre el vostre tema?',opts:['Sí','No']},
   {k:'cmp1',type:'select',label:'Expliquen el mateix?',opts:['Sí, diuen el mateix','Hi ha algunes diferències','Hi ha diferències importants']},
   {k:'cmp2',type:'select',label:'Quina explica el tema amb més detall?',opts:['La Viquipèdia','L’Enciclopèdia.cat','Són semblants']},
   {k:'cmp3',type:'select',label:'Quina diu qui n’és l’autor o l’autora?',opts:['La Viquipèdia','L’Enciclopèdia.cat','Totes dues','Cap']},
   {k:'cmp4',type:'select',label:'Quina té la data d’actualització més recent?',opts:['La Viquipèdia','L’Enciclopèdia.cat','No ho hem trobat']},
   {k:'cmp5',type:'text',label:'Quines altres semblances o diferències heu vist? (imatges, mida del text, dades…)'},
   {k:'titol',type:'text',label:'Títol o adreça de la pàgina'},
   {k:'autor',type:'text',label:'Qui l’ha escrit? (autoria; si no ho sabeu, escriviu «No consta»)'},
   {k:'font',type:'text',label:'D’on ve? (museu, escola, institució, diari, web personal…)'},
   {k:'data',type:'text',label:'De quan és? (data d’actualització, o «No consta»)'},

   {k:'verdict',type:'select',label:'Us fieu de la primera pàgina?',opts:['Sí','Una mica','No']},

'mitja-5':{
 puc:['Sé guardar una pàgina als preferits amb l’estrella','Sé crear una carpeta a la barra d’adreces d’interès per desar més d’una pàgina web que consulto habitualment'],
 lessons:[
  {t:'Els botons i les parts que ja coneixem',h:`Abans de guardar pàgines, recordem el navegador:<br>← <b>torna</b> a la pàgina d’abans. → <b>va</b> a la pàgina següent. ↻ <b>torna a carregar</b> la pàgina. ＋ <b>obre una pestanya nova</b>.<br>Les <b>pestanyes</b> deixen tenir més d’una pàgina oberta. La <b>barra d’adreces</b> mostra l’adreça de la pàgina. I l’<b>estrella</b> ☆ serveix per guardar-la: és el que treballarem ara.`,fig:()=>figBrowser('botons')},
  {t:'Els preferits (adreces d’interès)',h:`Els <b>preferits</b> són una llista de pàgines que guardes per <b>tornar-hi fàcilment</b>, sense haver de cercar-les de nou.<br>Es guarden clicant l’<b>estrella</b> ☆ que hi ha al <b>final de la barra de cerca del navegador</b>.`,fig:()=>figBookmarks()},
  {t:'Nom i carpeta',h:`Quan guardes una adreça d’interès, pots <b>canviar-ne el nom</b> i desar-la en una <b>carpeta</b> de la barra, per organitzar millor les pàgines web que tens guardades.`},
  {t:'La barra d’adreces d’interès',h:`Sota la barra d’adreces hi ha la <b>barra d’adreces d’interès</b>, amb les pàgines i les carpetes guardades.<br>Si no es veu, es pot mostrar amb [[key:Ctrl]] [[key:Maj]] [[key:B]].`,fig:()=>figBM()}],
 items:[
  ch('P1','pref','Quin <b>símbol</b> serveix per guardar una pàgina als preferits?',['🔍 Lupa','⭐ Estrella','🏠 Casa'],1,'És un símbol brillant.','L’estrella guarda la pàgina als preferits.'),
  ch('P2','pref','Per què guardem una pàgina als preferits?',['Per fer-la més ràpida','Per esborrar-la','Per tornar-hi fàcilment sense buscar-la'],2,'Pensa en tornar-hi un altre dia.','Els preferits serveixen per tornar a una pàgina sense haver-la de buscar de nou.'),
  {id:'P3',saber:'pref',type:'ordre',prompt:'<b>Ordena els passos</b> per guardar una pàgina. Toca’ls en l’ordre correcte.',steps:['Poso un nom i trio la carpeta','Obro la pàgina','Premo «Desa»','Clico l’estrella ☆'],order:[1,3,0,2],hint:'Primer cal tenir la pàgina oberta.',expl:'Ordre: obrir la pàgina, clicar l’estrella, posar nom i carpeta, i desar.'},
  ch('P5','pref','On es guarden els <b>preferits</b>?',['Al cercador (Google, Bing…)','Al navegador (Chrome, Firefox…)','Al teclat'],1,'Pensa en el programa que fem servir per entrar a Internet.','Els preferits es guarden al navegador, no al cercador.'),
  ch('P6','pref','Tens <b>cinc pàgines</b> guardades del mateix tema. Com les ordenes millor?',['Les poso en una carpeta amb el nom del tema','Les deixo totes soltes','Les esborro'],0,'Pensa en agrupar-les.','Una carpeta amb el nom del tema ajuda a trobar-les.'),
  ch('P4','pref','Per mostrar la <b>barra d’adreces d’interès</b> amb el teclat premem…',['[[key:Ctrl]] [[key:Maj]] [[key:Z]]','[[key:Ctrl]] [[key:P]]','[[key:Ctrl]] [[key:Maj]] [[key:B]]'],2,'La lletra és la B.','[[key:Ctrl]] [[key:Maj]] [[key:B]] mostra o amaga la barra d’adreces d’interès.')],
 sabers:{pref:{realDone:req(['nav','carpeta','g1','g2','g3','g4','g5','revisio'])}},
 real:{blocks:[
   {h:'<b>1.</b> Aquesta tasca es fa amb el <b>navegador</b>, no amb el cercador. Quin navegador esteu fent servir?',fields:['nav']},
   {h:'<b>2.</b> Creeu una <b>carpeta</b> a la barra d’adreces d’interès amb la <b>paraula clau</b> de la vostra investigació. (Cliqueu l’estrella ☆ d’una pàgina, trieu «Carpeta nova» i poseu-hi el nom.)',fields:['carpeta']},
   {h:'<b>3.</b> Cerqueu pàgines web amb informació d’interès per a la vostra investigació i <b>guardeu-ne 5 en aquesta carpeta</b>, una de cadascun d’aquests tipus. Escriviu el títol de cada pàgina:',fields:[]},
   {h:'📖 <b>Una entrada d’un diccionari digital</b>',web:[['Diccionari de l’IEC','https://dlc.iec.cat'],['Diccionari.cat','https://www.diccionari.cat']],fields:['g1']},
   {h:'🌍 <b>Una entrada d’una enciclopèdia digital</b>',web:[['Viquipèdia','https://ca.wikipedia.org'],['Enciclopèdia.cat','https://www.enciclopedia.cat']],fields:['g2']},
   {h:'🖼️ <b>L’enllaç a una imatge</b> (al cercador, trieu el menú <i>Imatges</i> i obriu una imatge).',search:true,fields:['g3']},
   {h:'📰 <b>L’enllaç a una notícia</b> (al cercador, trieu el menú <i>Notícies</i> i obriu una notícia).',fields:['g4']},
   {h:'✨ <b>Un enllaç lliure</b>: una pàgina que us sembli interessant.',fields:['g5']},
   {h:'<b>4.</b> Mostreu al professorat la carpeta de la barra d’adreces d’interès amb les cinc pàgines.',fields:['revisio']},
   {h:'<b>5.</b> Fitxa final del tema.',fields:['apres']}],
  fields:[{k:'nav',type:'select',label:'Quin navegador esteu fent servir?',opts:['Google Chrome','Firefox','Microsoft Edge','Un altre']},
   {k:'carpeta',type:'text',label:'Nom de la carpeta'},
   {k:'g1',type:'text',label:'Diccionari digital: títol de l’entrada'},
   {k:'g2',type:'text',label:'Enciclopèdia digital: títol de la pàgina'},
   {k:'g3',type:'text',label:'Imatge: títol o descripció'},
   {k:'g4',type:'text',label:'Notícia: titular'},
   {k:'g5',type:'text',label:'Enllaç lliure: títol de la pàgina'},
   {k:'revisio',type:'check',label:'Revisió del professorat',opts:['Estan totes en una carpeta','No hi ha cap enllaç del cercador: són totes pàgines web concretes']},
   {k:'apres',type:'text',label:'Una frase: què heu après del vostre tema?'}]}},

'superior-1':{
 puc:['Sé que el navegador i el cercador no són la mateixa eina i en sé donar exemples','Sé fer servir les eines del navegador: botons, pestanyes, enllaços i zoom','Sé obrir una mateixa pàgina en dos navegadors i comparar-ne les diferències'],
 lessons:[
  {t:'Navegador i cercador no són el mateix',h:`El <b>navegador</b> és el <b>programa</b> que instal·lem per veure pàgines web:%%row:chrome,firefox,edge,safari%%<br>El <b>cercador</b> és una <b>pàgina web</b> on escrivim què busquem:%%row:google,bing,duckduckgo,startpage%%<br>Exemple: <b>Google Chrome</b> és un navegador; <b>Google</b> és un cercador. Un cercador es pot obrir <b>des de qualsevol navegador</b>.`},
  {t:'Les parts del navegador',h:`Al navegador trobem: les <b>pestanyes</b> (per tenir més d’una pàgina oberta), la <b>barra d’adreces</b> (on hi ha l’adreça de la pàgina), els botons <b>←</b> (tornar enrere), <b>→</b> (anar endavant) i <b>↻</b> (recarregar) i l’<b>estrella</b> ☆ dels preferits.`,fig:()=>figBrowser('botons')},
  {t:'Hipervincles i pestanyes',h:`Un <b>hipervincle</b> (enllaç) és un text o una imatge que et porta a <b>una altra pàgina</b>. Normalment és <span class="lnk">blau i subratllat</span> i el cursor es converteix en una mà 👆.<br>Si vols conservar la pàgina on ets, pots obrir l’enllaç en una <b>pestanya nova</b>. Amb [[key:Ctrl]] i [[key:T]] s’obre una pestanya buida.`},
  {t:'El zoom',h:`El <b>zoom</b> serveix per <b>ampliar o reduir</b> el contingut de la pantalla.<br>[[key:Ctrl]] i [[key:+]] <b>amplia</b>; [[key:Ctrl]] i [[key:−]] fa <b>més petit</b>; [[key:Ctrl]] i [[key:0]] torna a la <b>mida normal</b> (el 0 és el número zero).<br>El navegador mostra el <b>percentatge</b> a la barra d’adreces.`,fig:()=>figZoom()},
  {t:'Què tenen en comú i en què es diferencien',h:`Tots els navegadors tenen <b>pestanyes</b>, <b>preferits</b> (adreces d’interès) i <b>historial</b>. Canvien l’aspecte, la velocitat i alguns extres.<br>Els preferits i l’historial es guarden <b>al navegador</b>: si canvies de navegador, no hi són.<br>Convé tenir el navegador <b>actualitzat</b> per seguretat. Si una pàgina no es veu bé, pots provar-la en un altre navegador.`}],
 items:[
  ch('N1','navs','Quin d’aquests és un <b>navegador</b>?',['[[logo:firefox]]','[[logo:word]]','[[logo:excel]]'],0,'Es fa servir per veure pàgines web.','Firefox és un navegador. Word i Excel són programes d’ofimàtica.'),
  ch('N2','navs','<b>Google</b> és…',['un navegador','un processador de textos','un cercador'],2,'És on escrivim què busquem.','Google és un cercador. Google Chrome és un navegador.'),
  ch('N3','navs','Quina és la <b>diferència</b> entre navegador i cercador?',['Són el mateix','El cercador és el que obre l’ordinador','El navegador és el programa; el cercador és la pàgina web on cerques'],2,'Un s’instal·la i l’altre és una web.','El navegador és el programa; el cercador és la pàgina on escrius què busques.'),
  ch('N4','navs','Una pàgina <b>no es veu bé</b>. Què pots provar?',['Obrir-la en un altre navegador','Apagar l’ordinador','Res'],0,'Cada navegador mostra les pàgines una mica diferent.','Obrir-la en un altre navegador pot solucionar-ho.'),
  ch('N5','navs','Què tenen <b>en comú</b> tots els navegadors?',['Els mateixos colors','Pestanyes, preferits i historial','El mateix preu'],1,'Pensa en les funcions bàsiques.','Tots tenen pestanyes, preferits i historial.'),
  ch('N6','navs','Vols <b>tornar a la pàgina anterior</b>. Què cliques?',['El botó ↻','El botó ←','L’estrella ☆'],1,'Una fletxa cap a l’esquerra.','El botó ← torna a la pàgina anterior.'),
  ch('N7','navs','El text és <b>massa petit</b>. Què fas?',['[[key:Ctrl]] i [[key:−]]','[[key:Esc]]','[[key:Ctrl]] i [[key:+]]'],2,'Vols fer-lo més gran.','[[key:Ctrl]] i [[key:+]] amplia el contingut.'),
  ch('N8','navs','Pots obrir <b>Google</b> amb el navegador <b>Firefox</b>?',['Sí, un cercador s’obre des de qualsevol navegador','No, només amb Chrome','Només si l’instal·lo'],0,'El cercador és una pàgina web.','Un cercador és una pàgina web i es pot obrir des de qualsevol navegador.'),
  ch('N9','navs','Has guardat preferits a Chrome i obres Firefox. <b>Hi seran?</b>',['Sí, sempre','Només si hi ha internet','No, es guarden a cada navegador'],2,'Pensa on es guarden.','Els preferits es guarden al navegador: en un altre navegador no hi són.')],

   {k:'enllac',type:'select',label:'Has tornat enrere amb ←?',opts:['Sí','No'],ok:'Sí'}]}},

'superior-2':{
 puc:['Sé que hi ha cercadors generals (Google, Bing, DuckDuckGo, Startpage…) i que els puc obrir des de qualsevol navegador','Sé triar un motor de cerca específic (imatges, sons, articles científics) segons el que busco'],
 lessons:[
  {t:'Cercadors generals',h:`Un <b>cercador general</b> serveix per buscar de tot:%%row:google,bing,duckduckgo,startpage%%<br>Són pàgines web: s’obren <b>des de qualsevol navegador</b>. <b>DuckDuckGo</b> i <b>Startpage</b> es presenten com a cercadors que protegeixen més la teva privadesa.`},
  {t:'Cada cercador mostra resultats diferents',h:`Si busques el mateix en dos cercadors, els resultats <b>no són exactament els mateixos</b>: l’ordre i la quantitat canvien.<br>Els primers resultats poden ser <b>anuncis</b> (sol posar «Anunci» o «Patrocinat»). Un anunci vol vendre, no sempre informar.`},
  {t:'Motors de cerca específics',h:`Un <b>motor específic</b> busca un sol tipus de contingut:<br>🖼️ <b>Wikimedia Commons</b>: imatges i fitxers lliures.<br>🔊 <b>Freesound</b>: sons lliures.<br>🎓 <b>Google Acadèmic</b>: articles científics.<br>Si saps què busques, un motor específic és més precís.<br>Clica el logotip per obrir-lo:`,links:['commons','freesound','scholar']},
  {t:'Com triar el motor',h:`Pregunta’t: <b>què necessito?</b><br>Una informació general → un cercador general.<br>Una imatge o un so que pugui reutilitzar → un banc d’imatges o de sons lliures.<br>Un estudi científic → un motor acadèmic.`}],
 items:[
  ch('C1','motors','Quin d’aquests és un <b>cercador general</b>?',['Google','Word','Freesound'],0,'Serveix per buscar de tot.','Google és un cercador general. Freesound és un motor específic de sons.'),
  ch('C2','motors','Cerques el mateix a Google i a Bing. Els resultats són…',['Exactament els mateixos','Sempre de països diferents','Semblants, però no idèntics'],2,'Cada cercador té el seu sistema.','Cada cercador ordena i mostra els resultats a la seva manera.'),
  ch('C3','motors','Un resultat diu <b>«Anunci»</b>. Què vol dir?',['Que és el més fiable','Que és una notícia d’avui','Que algú ha pagat perquè surti: vol vendre o promocionar'],2,'Pensa en la finalitat.','Un anunci l’ha pagat algú per promocionar alguna cosa.'),
  ch('C4','motors','Pots obrir <b>Google</b> des del navegador <b>Firefox</b>?',['Sí, un cercador s’obre des de qualsevol navegador','No','Només si l’instal·lo'],0,'El cercador és una pàgina web.','Un cercador és una pàgina web: s’obre des de qualsevol navegador.'),
  ch('M1','motors','Vols <b>sons</b> que es puguin fer servir lliurement. On cerques?',['Només en un cercador general','En un banc de sons lliures (com Freesound)','En un joc'],1,'Cal un lloc especialitzat en sons.','Un banc de sons lliures ofereix sons reutilitzables.'),
  ch('M2','motors','Vols <b>imatges</b> lliures. On cerques?',['En una xarxa social','En un banc d’imatges lliures (com Wikimedia Commons)','En un xat'],1,'Cal un lloc especialitzat en imatges.','Wikimedia Commons recull imatges lliures.'),
  ch('M3','motors','Vols <b>articles científics</b>. Què fas servir?',['Un banc de sons','Un diccionari','Un motor acadèmic (com Google Acadèmic)'],2,'Busca informació d’investigació.','Google Acadèmic cerca articles científics.'),
  ch('M4','motors','Quan <b>convé</b> un motor específic?',['Quan sé quin tipus de contingut busco','Mai','Només per jugar'],0,'Pensa en la precisió.','Si saps què busques, un motor específic és més precís.')],
 sabers:{motors:{realDone:req(['cerc1','cerc2','mateixos','anunci','mc','mf','ma','mutil'])}},

'superior-3':{
 puc:['Sé triar les paraules clau d’una pregunta i fer servir les cometes per buscar una frase exacta','Sé limitar una cerca per data, per lloc i per idioma amb les eines del cercador','Sé cercar en una altra llengua i fer servir el traductor quan trobo poca informació'],
 lessons:[
  {t:'Paraules clau i cometes',h:`Una <b>paraula clau</b> és la paraula més important del que vols saber. Al cercador no cal escriure frases llargues.<br>Pregunta: <i>«Què mengen els llops ibèrics al bosc?»</i> → paraules clau: <b>llops ibèrics mengen</b>.<br>Si vols que el cercador busqui unes paraules <b>justament juntes</b>, posa-les <b>entre cometes</b>: <b>"llop ibèric"</b>.<br>Si surten resultats que no volies, pots <b>excloure una paraula</b> amb un signe menys davant: <b>jaguar −cotxe</b>.`},
  {t:'El menú de cerques',h:`Sota la barra de cerca hi ha un menú: <b>Tot</b>, <b>Imatges</b>, <b>Vídeos</b> i <b>Notícies</b>. Cada opció et dona un tipus de resultat.<br>Aquest menú és de la pàgina del <b>cercador</b> (Google, Bing…), no del navegador. Al costat també hi ha <b>Eines</b>, per filtrar els resultats.`,fig:()=>figMenu()},
  {t:'Eines: filtrar per data',h:`A <b>Eines</b> (o <b>Filtres</b>) pots triar el <b>moment</b>: última hora, últim dia, última setmana, últim mes, últim any o un període que triïs.<br>Serveix per a temes que canvien (notícies, tecnologia, dades) i per evitar informació antiga.`,fig:()=>figEines('web')},
  {t:'Concretar el lloc',h:`Per limitar una cerca per <b>lloc</b>, afegeix-lo a les paraules clau: <b>festes majors Alt Penedès</b>.<br>Sense el lloc, surten festes de tot el món.`},
  {t:'Idioma i traductor',h:`A <b>Eines</b> també pots triar l’<b>idioma</b> de les pàgines. Si trobes poca informació en català, prova-ho en <b>una altra llengua</b> (per exemple, anglès) i fes servir el <b>traductor</b> per entendre les pàgines.`}],
 items:[
  {id:'K1',saber:'estrat',type:'words',words:['Vull','saber','quants','habitants','té','Vilafranca','del','Penedès'],end:'',correct:['habitants','Vilafranca','Penedès'],hint:'Busca què vols saber i de quin lloc.',expl:'Habitants, Vilafranca i Penedès diuen què busques i on. Les altres paraules només omplen la frase.'},
  ch('K2','estrat','Vols buscar exactament <b>fil·loxera Sant Sadurní</b>, amb les paraules juntes. <b>Què fas?</b>',['Les poso entre cometes ( " " )','Les separo amb comes','Hi poso un signe menys davant'],0,'Les cometes són aquest símbol " ".','Amb les cometes, el cercador busca la frase exacta.'),
  ch('K3','estrat','Cerques <b>jaguar</b> i et surten cotxes, però vols l’animal. <b>Què pots fer?</b>',['Escriure jaguar entre cometes','Cercar només al menú Notícies','Escriure jaguar −cotxe'],2,'Un signe menys davant d’una paraula l’exclou.','El signe − davant d’una paraula fa que el cercador no mostri resultats amb aquesta paraula.'),
  ch('K4','estrat','Vols veure <b>com es fa</b> un nus marí, pas a pas, en moviment. Quin menú del cercador tries?',['Imatges','Notícies','Vídeos'],2,'Cal veure el procés en moviment.','El menú Vídeos mostra imatges en moviment, útils per veure un procés.'),
  ch('E1','estrat','Necessites notícies <b>de l’últim mes</b>. Què fas?',['Filtro per data a Eines','Escric «notícies» entre cometes','Cerco al menú Imatges'],0,'Mira a Eines.','El filtre de data limita la cerca al període que vols.'),
  ch('E2','estrat','Només vols pàgines <b>en català</b>. Què fas?',['Afegeixo «català» entre cometes','Filtro per idioma a Eines','Filtro per data'],1,'Hi ha un filtre per a això.','El filtre d’idioma mostra només pàgines en aquesta llengua.'),
  ch('E3','estrat','Cerques «festes majors» i surten de tot el món. <b>Com ho concretes?</b>',['Hi afegeixo l’any','Afegeixo el lloc: festes majors Alt Penedès','Cerco al menú Notícies'],1,'Què et falta dir?','Afegir el lloc fa la cerca més precisa.'),
  ch('E4','estrat','Una pàgina sobre mòbils és del 2009. <b>Què fas per veure informació recent?</b>',['Faig servir la informació i en cito la data','Cerco la pàgina en un altre idioma','Filtro per data (any actual)'],2,'La informació de mòbils canvia molt.','Filtrant per data veus informació recent.'),
  ch('E5','estrat','Trobes poca informació en català. <b>Què pots provar?</b>',['Cercar en un altre idioma i traduir','Repetir la mateixa cerca amb altres paraules en català','Cercar amb menys paraules'],0,'Hi ha més pàgines en altres llengües.','Cercar en un altre idioma pot donar més resultats; el traductor ajuda a entendre’ls.'),
  ch('E6','estrat','El menú <b>Tot, Imatges, Vídeos, Notícies</b> pertany…',['Al navegador','Al teclat','Al cercador'],2,'Surt sota la barra de cerca, dins la pàgina.','És el menú de la pàgina del cercador, no del navegador.')],

'superior-4':{
 puc:['Sé triar el menú Imatges o Vídeos i fer servir les eines (mida, tipus, drets d’ús, durada)','Sé identificar una imatge amb llicència lliure i anotar-ne l’autoria','Sé triar la mida i el format adequats d’una imatge (JPG, PNG)'],
 lessons:[
  {t:'Imatges i vídeos al cercador',h:`El menú del cercador ens deixa triar el tipus de resultat. Aquest menú és del <b>cercador</b>, no del navegador.<br>A <b>Eines</b> pots filtrar els resultats segons el que necessitis.`,fig:()=>figMenu(true)},
  {t:'Eines d’imatges',h:`A <b>Eines</b> de les imatges pots triar:<br>📏 <b>Mida</b>: petita, mitjana o gran.<br>🎨 <b>Color</b>: en color, en blanc i negre o transparent.<br>🖼️ <b>Tipus</b>: fotografia, dibuix, GIF…<br>⚖️ <b>Drets d’ús</b> (llicències): per triar imatges que es poden reutilitzar.`,fig:()=>figEines('img')},
  {t:'Drets d’autor: què puc fer amb un contingut?',h:`Tot el que trobem a internet (🖼️ imatges, 🎬 vídeos, 🎵 música i sons, 📝 textos, 💻 programes) té un <b>autor o autora</b> que en té els <b>drets</b>.<br>© <b>Tots els drets reservats</b>: és el cas per defecte. Per fer-lo servir cal <b>demanar permís</b>.<br>🔓 <b>Llicència lliure</b>: l’autoria permet reutilitzar-lo amb unes condicions. La llicència més coneguda és <b>Creative Commons (CC)</b>.<br>🌐 <b>Domini públic</b>: obres sense drets (per exemple, perquè fa molts anys que l’autor va morir).<br>La llicència sol aparèixer a la <b>pàgina d’origen</b> del contingut, a prop de l’autoria.`},
  {t:'Llicències Creative Commons: les icones',h:`Una llicència CC es forma combinant icones. Cada una és una condició:<br>👤 <b>BY</b>: has de <b>citar l’autoria</b>.<br>💲🚫 <b>NC</b> (no comercial): no es pot fer servir per guanyar diners.<br>✏️🚫 <b>ND</b> (sense obres derivades): no es pot modificar.<br>🔁 <b>SA</b> (compartir igual): si el modifiques, has de publicar-lo amb la mateixa llicència.<table class="lic"><tr><th>Llicència</th><th>Pots…</th><th>Cal…</th></tr><tr><td><b>CC0</b> / domini públic</td><td>Tot</td><td>Res</td></tr><tr><td><b>CC BY</b></td><td>Reutilitzar i modificar</td><td>Citar l’autoria</td></tr><tr><td><b>CC BY-SA</b></td><td>Reutilitzar i modificar</td><td>Citar l’autoria i compartir amb la mateixa llicència</td></tr><tr><td><b>CC BY-NC</b></td><td>Reutilitzar i modificar, sense ús comercial</td><td>Citar l’autoria</td></tr><tr><td><b>CC BY-ND</b></td><td>Reutilitzar sense modificar</td><td>Citar l’autoria</td></tr><tr><td><b>CC BY-NC-ND</b></td><td>La més restrictiva: només compartir tal qual, sense ús comercial</td><td>Citar l’autoria</td></tr></table>Sense llicència lliure, <b>no es pot fer servir sense permís</b>.`},
  {t:'Mida, píxels i pixelació',h:`Una fotografia digital està feta de <b>píxels</b>, quadradets de color. La <b>mida</b> d’una imatge es mesura en píxels (per exemple, 1920 × 1080).<br>Si amplies molt una imatge petita, els píxels es fan grans i es veuen els quadradets: és la <b>pixelació</b> i la imatge perd qualitat.<br>Per això, per a un cartell o una pantalla gran cal una imatge de <b>mida gran</b> (molts píxels).<br>No és el mateix la <b>mida en píxels</b> (quanta resolució té) que el <b>pes</b> (quants KB o MB ocupa el fitxer).`,fig:()=>figPix()},
  {t:'Formats d’imatge',h:`El <b>format</b> és el tipus de fitxer:<br>📷 <b>JPG</b>: ideal per a fotografies; pesa poc, però comprimeix i perd una mica de qualitat. No té fons transparent.<br>🪟 <b>PNG</b>: admet <b>fons transparent</b> i manté nítids els textos i les captures de pantalla. Pesa més que un JPG.<br>🎞️ <b>GIF</b>: pot tenir <b>moviment</b>, però té pocs colors.<br>📐 <b>SVG</b>: imatge <b>vectorial</b> (fa servir formes i línies, no píxels). Es pot ampliar sense pixelar-se: és ideal per a logotips i icones.<br>🌐 <b>WebP</b>: format modern, lleuger, molt usat a les pàgines web.`},
  {t:'Vídeos',h:`Als vídeos, a <b>Eines</b> pots filtrar per <b>durada</b> (curts, mitjans o llargs), per <b>data</b> i per <b>qualitat</b>.<br>Els vídeos també tenen autoria i llicència. Mira qui l’ha publicat, igual que amb una pàgina web.`}],
 items:[
  ch('I1','imatges','Prepares un cartell per a una botiga que vendrà productes. La imatge és <b>CC BY-NC</b>. <b>Pots fer-la servir?</b>',['No, perquè NC no permet l’ús comercial','Sí, citant l’autoria','Sí, si la modifico una mica'],0,'NC vol dir «no comercial».','CC BY-NC no permet l’ús comercial: un cartell d’una botiga és un ús comercial.'),
  ch('I2','imatges','Vols <b>retallar i canviar els colors</b> d’una imatge <b>CC BY-ND</b>. Què passa?',['Pots, citant l’autoria','Pots si la comparteixes amb la mateixa llicència','No pots: ND no permet fer-hi obres derivades'],2,'ND vol dir «sense obres derivades».','CC BY-ND només permet reutilitzar-la tal qual, sense modificar-la.'),
  ch('I3','imatges','Has modificat una imatge <b>CC BY-SA</b>. <b>Què cal fer en publicar-la?</b>',['Res, ara ja és meva','Esborrar l’autoria','Citar l’autoria original i publicar-la amb la mateixa llicència'],2,'SA vol dir «compartir igual».','CC BY-SA obliga a citar l’autoria i a compartir l’obra nova amb la mateixa llicència.'),
  ch('I4','imatges','Quina llicència té <b>menys restriccions</b>?',['CC0 (domini públic)','CC BY-NC-ND','CC BY-SA'],0,'Cap dret reservat.','CC0 no té condicions: es pot fer servir sense citar l’autoria.'),
  ch('I5','imatges','Una imatge de <b>300 × 200 píxels</b> s’amplia per imprimir-la en un cartell d’1 metre. <b>Què passarà?</b>',['Es veurà més nítida','Es pixelarà: es veuran els quadradets','No canviarà res'],1,'Pensa en els píxels.','Amb pocs píxels, en ampliar-la es veuen els quadradets: és la pixelació.'),
  ch('I6','imatges','Vols un <b>logotip</b> que es vegi nítid a qualsevol mida. <b>Quin format és millor?</b>',['JPG','SVG (vectorial)','GIF'],1,'Un format que no fa servir píxels.','Un SVG és vectorial: es pot ampliar sense perdre nitidesa.'),
  ch('I7','imatges','Vols una <b>captura de pantalla</b> amb text nítid i fons transparent. <b>Quin format?</b>',['JPG','PNG','GIF'],1,'Un format que admet transparència i no comprimeix com un JPG.','El PNG manté nítid el text i admet fons transparent.'),
  ch('I8','imatges','Una pàgina diu <b>«© Maria Soler, 2023»</b> i no esmenta cap llicència lliure. <b>Què fas?</b>',['Demano permís o en busco una amb llicència lliure','La faig servir citant la Maria','La faig servir si és per a l’escola, sense dir res'],0,'© vol dir tots els drets reservats.','Amb tots els drets reservats cal demanar permís o triar un altre contingut.'),
  ch('I9','imatges','La revisió de llicències, <b>només serveix per a les imatges?</b>',['Sí, només per a les imatges','Només per als vídeos','No: també per a vídeos, música, textos i programes'],2,'Tot té autoria.','Tot el contingut té autoria i drets: també cal mirar la llicència de vídeos, música i textos.'),
  ch('I10','imatges','Per a una exposició de <b>3 minuts</b> vols un vídeo que expliqui un procés. <b>Què filtres?</b>',['La durada (vídeos curts)','El color','Els drets d’ús'],0,'Has d’ajustar-te al temps.','El filtre de durada ajuda a trobar un vídeo que càpiga a l’exposició.'),
  ch('I11','imatges','Quina és la diferència entre la <b>mida en píxels</b> i el <b>pes</b> d’una imatge?',['El pes depèn del color del fons','La mida diu quants píxels té; el pes, quants KB o MB ocupa el fitxer','Cap: són el mateix'],1,'Una és de resolució i l’altra d’espai.','La mida en píxels indica la resolució; el pes indica l’espai que ocupa el fitxer.'),
  ch('I12','imatges','Vols saber <b>què ha passat avui</b> a la teva comarca. <b>Quin menú i quin filtre combines?</b>',['Notícies i filtre per data','Imatges i filtre per mida','Vídeos i filtre per color'],0,'És un fet recent.','El menú Notícies amb un filtre de data mostra els fets més recents.')],

'superior-5':{
 puc:['Sé triar el tipus de font digital adequat: diccionari, enciclopèdia, llibre, premsa, revista científica o pàgina divulgativa','Sé analitzar una pàgina (autoria, font, data i finalitat) i comparar-la amb una altra per decidir quina informació és més fiable'],
 lessons:[
  {t:'Tipus de fonts digitals',h:`Segons el que necessitem, triem una font diferent:<br>📖 <b>Diccionari digital</b>: significat, ortografia i usos d’una paraula.<div class="logos"><a class="btn sec" href="https://dlc.iec.cat" target="_blank" rel="noopener">🔗 Diccionari de l’IEC</a> <a class="btn sec" href="https://www.diccionari.cat" target="_blank" rel="noopener">🔗 Diccionari.cat</a></div><br>🌍 <b>Enciclopèdia digital</b>: resum d’un tema amb dades i dates.<div class="logos"><a class="btn sec" href="https://ca.wikipedia.org" target="_blank" rel="noopener">🔗 Viquipèdia</a> <a class="btn sec" href="https://www.enciclopedia.cat" target="_blank" rel="noopener">🔗 Enciclopèdia.cat</a></div><br>📚 <b>Llibre digital</b>: una obra sencera a la pantalla.<div class="logos"><a class="btn sec" href="https://ca.wikisource.org" target="_blank" rel="noopener">🔗 Viquitexts (Wikisource)</a> <a class="btn sec" href="https://www.gutenberg.org" target="_blank" rel="noopener">🔗 Projecte Gutenberg</a></div><br>📰 <b>Premsa digital</b>: fets que han passat fa poc.<div class="logos"><a class="btn sec" href="https://www.3cat.cat/3catinfo/" target="_blank" rel="noopener">🔗 3Cat Notícies</a> <a class="btn sec" href="https://www.ara.cat" target="_blank" rel="noopener">🔗 Ara</a> <a class="btn sec" href="https://www.vilaweb.cat" target="_blank" rel="noopener">🔗 VilaWeb</a> <a class="btn sec" href="https://www.elpuntavui.cat" target="_blank" rel="noopener">🔗 El Punt Avui</a> <a class="btn sec" href="https://directa.cat" target="_blank" rel="noopener">🔗 La Directa</a></div><br>🔬 <b>Revista científica</b>: resultats de recerca (per exemple, a Google Acadèmic).<br>📘 <b>Pàgina divulgativa</b>: explica temes de manera senzilla.`},
  {t:'Analitzar una pàgina: 4 preguntes',h:`Abans de fer servir una informació, ens preguntem:<br>1️⃣ <b>Qui ho ha escrit?</b> (autoria)<br>2️⃣ <b>D’on ve?</b> (font: museu, escola, institució…)<br>3️⃣ <b>De quan és?</b> (data d’actualització)<br>4️⃣ <b>Per què ho han escrit?</b> (finalitat: informar, ensenyar, vendre o convèncer)<br>Si falten pistes o la finalitat és vendre, hem de ser prudents.`},
  {t:'Comparar fonts',h:`Una sola pàgina no sempre és prou. Si <b>dues o tres pàgines fiables</b> expliquen el mateix, la informació és més segura.<br>Si una pàgina diu una cosa molt diferent de totes les altres i no diu qui l’ha escrit, cal <b>desconfiar-ne</b>.<br>Si dues pàgines fiables donen dades diferents, ens quedem amb la <b>més recent</b>.`},
  {t:'La finalitat: qui hi guanya?',h:`Cada pàgina s’escriu amb una <b>finalitat</b>: <b>informar</b> (un diari o un museu), <b>ensenyar</b> (una pàgina divulgativa), <b>vendre</b> (una botiga o un anunci) o <b>convèncer</b> (una campanya o un blog d’opinió).<br>La finalitat canvia què ens mostren. Una pàgina que ven un producte destacarà els avantatges i callarà els problemes. Per això, davant d’una informació, pregunta’t: <b>qui hi guanya, si me la crec?</b>`},
  {t:'Fet o opinió',h:`Un <b>fet</b> es pot comprovar: «El llop ibèric és una subespècie del llop». Una <b>opinió</b> és el que pensa algú: «Els llops són perillosos». Les opinions poden ser útils, però no són dades.<br>Les paraules com <i>increïble</i>, <i>sempre</i>, <i>mai</i> o <i>tothom</i> solen indicar opinió o exageració.`},
  {t:'El biaix: què ens mostren i què s’oblida',h:`Un text té <b>biaix</b> quan presenta només una part de la realitat i inclina el lector cap a una idea. Pistes: <b>una sola veu</b>, llenguatge molt carregat, titulars exagerats o dades sense font.<br>Un text amb biaix pot dir coses certes i, tot i així, deixar-ne fora d’altres. La solució és <b>contrastar</b> amb fonts que no tinguin la mateixa finalitat.`},
  {t:'Fonts independents',h:`Dues pàgines que diuen el mateix <b>no sempre són dues fonts</b>: moltes copien la mateixa notícia. Per saber si són independents, mira si <b>citen la font original</b> i si l’han escrit autors diferents.<br>Si totes les pàgines porten a una sola font, el que sabem és <b>tan fiable com aquesta font</b>.`}],
 items:[
  ch('T1','tipus','Vols una <b>notícia d’ahir</b>. Quina font?',['Premsa digital','Revista científica','Diccionari'],0,'Notícies recents.','La premsa digital publica notícies del dia.'),
  ch('T2','tipus','Vols els <b>resultats d’una investigació</b>. Quina font?',['Premsa','Fòrum','Revista científica'],2,'Publica estudis revisats.','Les revistes científiques publiquen resultats de recerca.'),
  ch('T3','tipus','Vols una <b>explicació senzilla</b> d’un tema. Quina font?',['Revista científica','Anunci','Pàgina divulgativa'],2,'Ha d’estar pensada per a tothom.','Una pàgina divulgativa explica temes de manera senzilla.'),
  ch('T4','tipus','Quina font és <b>menys adequada</b> per a un treball de ciència?',['Un comentari anònim en un fòrum','Una revista científica','Un museu'],0,'No sabem qui l’escriu.','Un comentari anònim no es pot comprovar.'),
  ch('T5','tipus','Vols saber el <b>significat i l’ortografia</b> de la paraula <b>xaloc</b>. Quina font?',['La premsa digital','Un diccionari digital','Una revista científica'],1,'Busca la font que explica paraules.','Un diccionari digital explica el significat, l’ortografia i els usos d’una paraula.'),
  ch('T6','tipus','Per fer un treball sobre el <b>Delta de l’Ebre</b> vols un resum general amb dades i dates. <b>Quina font tries primer?</b>',['Un diccionari digital','Una enciclopèdia digital','Una notícia d’avui'],1,'Necessites una visió general d’un tema.','Una enciclopèdia digital resumeix un tema amb dades, dates i explicacions.'),
  ch('T7','tipus','Vols saber què ha passat <b>aquest cap de setmana</b> a la teva ciutat. <b>Quina font és més adequada i per què?</b>',['Una enciclopèdia digital, perquè resumeix els temes','Un diccionari digital, perquè explica paraules','La premsa digital, perquè explica fets recents'],2,'Es tracta d’un fet molt recent.','La premsa digital explica fets que han passat fa poc.'),
  ch('T8','tipus','Vols llegir una <b>novel·la sencera</b> a la pantalla i poder canviar la mida de la lletra. <b>Què busques?</b>',['Un llibre digital','Una notícia','Un diccionari digital'],0,'Una obra sencera es llegeix en un …','Un llibre digital permet llegir una obra sencera a la pantalla.'),
  ch('V1','tipus','<b>Llegeix la pàgina.</b> Per a què udolen els llops? I pots fiar-te’n?',['Udolen quan tenen fam; no m’hi fio perquè no té data','Udolen a la lluna; m’hi fio perquè és una pàgina d’un museu','Udolen per comunicar-se amb la manada i marcar el territori; m’hi fio perquè té autor, font i data'],2,'Llegeix el text i mira les quatre pistes.','El text explica que els llops udolen per comunicar-se i marcar el territori, i la pàgina té autor, font i data.',{html:pageBox(pg('museu-natura.exemple/llops-udol','Per què udolen els llops?','Dr. Jordi Puig, etòleg','Gener de 2025','Museu de Ciències Naturals','Els llops udolen per comunicar-se amb la resta de la manada i marcar el territori. Un udol es pot sentir a diversos quilòmetres.'))}),
  ch('V2','tipus','<b>Llegeix la pàgina.</b> Quina és la <b>finalitat</b> més probable d’aquesta pàgina?',['Vendre un curs','Informar sobre com s’aprenen idiomes amb dades científiques','Ensenyar anglès gratuïtament'],0,'Fixa’t en el preu i en «Apunta’t ara».','La pàgina vol vendre un curs: no té autoria ni data, i parla de preu i de places limitades.',{html:pageBox(pg('curs-rapid.exemple/angles','Aprèn anglès en només 7 dies! El mètode secret!','No consta','No consta','Acadèmia en línia','Només 49 €. Apunta’t ara i parla anglès com un nadiu. Places limitades!'))}),
  ch('F1','tipus','Una pàgina de <b>bicicletes</b> diu: «La nostra és la millor del món». Quina és la <b>finalitat</b> més probable?',['Informar de manera neutra','Vendre bicicletes','Ensenyar a fer-les servir'],1,'Pensa qui hi guanya si te la creus.','La frase presumeix del producte: la finalitat és vendre.'),
  ch('F2','tipus','Quina frase és un <b>fet</b> i no una opinió?',['Els llops són animals perillosos','Aquest bosc és el més bonic de Catalunya','El llop ibèric viu a la península Ibèrica'],2,'Un fet es pot comprovar.','Es pot comprovar a una font fiable. Les altres dues són opinions.'),
  ch('F3','tipus','Tres pàgines diuen el mateix, però totes copien <b>una notícia sense citar-ne l’origen</b>. Què en pots concloure?',['Que és molt fiable, perquè ho diuen tres pàgines','Que potser és una sola font repetida i cal buscar-ne l’origen','Que és falsa'],1,'Compta quantes fonts originals hi ha.','Si totes copien la mateixa font, no són independents: cal trobar l’original.'),
  ch('V3','tipus','Dues pàgines fiables donen <b>xifres diferents</b>. Quina dada fas servir i per què?',['La més antiga, perquè ja està comprovada','La més recent, perquè està més actualitzada','Les dues alhora'],1,'Mira la data.','Si dues fonts fiables donen dades diferents, ens quedem amb la més recent.')],
 sabers:{tipus:{realDone:req(['dicIEC','dicCat','genere','viq','enc','cmp1','cmp4','autor','data','finalitat','verdict'])}},

'superior-6':{
 puc:['Sé citar una font: qui l’ha feta, on és (adreça) i quan l’he consultada','Sé trobar la data d’actualització d’una pàgina i valorar si la informació és prou recent'],
 lessons:[
  {t:'Per què citem les fonts',h:`<b>Citar</b> és indicar d’on has tret la informació. Serveix per <b>reconèixer l’autoria</b> i perquè qui et llegeix pugui <b>comprovar</b> les dades.<br>Abans de citar, recorda les 4 preguntes: <b>qui</b> ho ha escrit, <b>d’on</b> ve, <b>de quan</b> és i <b>per què</b> ho han escrit.`},
  {t:'Com es cita una font',h:`Una cita indica <b>qui</b> ho ha fet, <b>on</b> és (adreça web) i <b>quan l’has consultada</b>.<br>Exemple: <i>Museu de Ciències, museu.exemple/llops, consultat el 4/11/2026</i>.<br>Si no hi ha autoria, escriu el nom del web o de la institució.`},
  {t:'Paraules pròpies',h:`Si copies un fragment, no pots presentar-lo com si fos teu. Cal <b>reescriure’l amb paraules pròpies</b> i citar la font.<br>Si en vols copiar una frase exacta, posa-la <b>entre cometes</b> i cita-la.`},
  {t:'La data d’actualització',h:`Sol estar <b>sota el títol</b> o <b>al peu de la pàgina</b>.<br>És més important en temes que canvien (notícies, dades, tecnologia). Si no hi ha data, busca una altra font o comprova-ho.`},
  {t:'Informació recent o antiga?',h:`Mira la data i pregunta’t: <b>aquest tema ha canviat des d’aleshores?</b><br>Un nus de corbata no canvia; la població d’una ciutat sí. Si dues fonts fiables donen dades diferents, ens quedem amb la <b>més recent</b>.`}],
 items:[
  ch('C1','cita','Què és <b>citar una font</b>?',['Indicar d’on has tret la informació','Copiar-la','Esborrar-la'],0,'Dius d’on ve.','Citar és indicar d’on has tret la informació.'),
  ch('C2','cita','Quina <b>cita</b> és correcta?',['«Internet»','«Una pàgina»','«Museu de Ciències, museu.exemple/llops, consultat el 4/11/2026»'],2,'Ha de permetre trobar-la de nou.','Una cita completa indica qui, on i quan.'),
  ch('C3','cita','Per què <b>citem</b>?',['Per allargar el treball','Per decorar','Per reconèixer l’autoria i poder comprovar la informació'],2,'Dues raons.','Citar reconeix l’autoria i permet comprovar la informació.'),
  ch('C4','cita','Has copiat un paràgraf. <b>Què cal fer?</b>',['Reescriure’l amb paraules pròpies i citar la font','Res','Canviar-li el color'],0,'No es pot presentar com si fos teu.','Cal reescriure’l amb paraules pròpies i citar la font.'),
  ch('C5','cita','A la cita <i>«museu.exemple/llops»</i> hi falta alguna cosa. <b>Què?</b>',['Res, és prou','Qui ho ha fet i quan l’he consultada','El color'],1,'Una cita completa té tres dades.','Una cita completa indica qui, on i quan.'),
  ch('D1','data','On busques la <b>data d’actualització</b>?',['A la barra d’eines','Sota el títol o al peu de la pàgina','Al teclat'],1,'És a la pàgina.','Sol estar sota el títol o al peu de la pàgina.'),
  ch('D2','data','Dades de població d’una pàgina de <b>2008</b>. Què fas?',['Les faig servir','Les arrodoneixo','Busco dades més recents'],2,'Les dades canvien amb el temps.','Cal buscar dades més recents.'),
  ch('D3','data','Per a quin tema és <b>més important la data</b>?',['Els resultats de la lliga de futbol femení d’aquesta temporada','Com fer un nus de corbata','Els colors de l’arc de Sant Martí'],0,'Un tema que canvia sovint.','En temes que canvien sovint, la data és molt important.'),
  ch('D4','data','No trobes <b>cap data</b> a la pàgina. Què fas?',['Em crec la informació perquè surt entre els primers resultats del cercador','Faig servir la informació i hi poso la data en què l’he consultada com si fos la de publicació','Busco una altra font amb data o ho comprovo'],2,'Falta una pista.','Si no hi ha data, es comprova amb una altra font.'),
  ch('D5','data','Dues pàgines fiables donen <b>xifres diferents</b>. Una és del 2015 i l’altra del 2025. <b>Quina fas servir?</b>',['La del 2025','La del 2015','Cap'],0,'Mira la data.','Ens quedem amb la més recent.')],
 sabers:{cita:{realDone:req(['cita1','cita2','frase'])},data:{realDone:req(['data1','data2','actual','recent'])}},

   {h:'<b>1.</b> Cerca el teu tema i obre <b>dues fonts</b> de tipus diferent (per exemple, una enciclopèdia i una notícia).',search:true,fields:[]},
   {h:'<b>2.</b> Escriu la <b>cita</b> de cada font (qui, on i quan l’has consultada).',fields:['cita1','cita2']},

   {h:'<b>4.</b> Valora si la informació és <b>prou recent</b> per al teu tema.',fields:['recent']},
   {h:'<b>5.</b> Tria una frase d’una de les fonts i escriu-la amb <b>paraules pròpies</b>.',fields:['frase']}],
  fields:[{k:'cita1',type:'text',label:'Cita de la font 1 (qui, on i quan l’has consultada)'},
   {k:'cita2',type:'text',label:'Cita de la font 2'},
   {k:'data1',type:'text',label:'Data d’actualització de la font 1 (o «No consta»)'},
   {k:'data2',type:'text',label:'Data d’actualització de la font 2 (o «No consta»)'},
   {k:'actual',type:'select',label:'Quina és la més actual?',opts:['La font 1','La font 2','Igual','No ho sé']},
   {k:'recent',type:'select',label:'És prou recent per al teu tema?',opts:['Sí','No, busco una altra font','El tema no canvia gaire']},

/* ================= FIGURES AMPLIADES (cicles mitjà i superior) ================= */
const FS=(h,aria,inner)=>`<svg viewBox="0 0 640 ${h}" role="img" aria-label="${aria}"><rect x="2" y="2" width="636" height="${h-4}" rx="14" fill="#fff" stroke="#b8c2cf" stroke-width="2"/>${inner}</svg>`;
const FT=(x,y,t,sz,w,f,a)=>`<text x="${x}" y="${y}" text-anchor="${a||'middle'}" font-size="${sz||18}" font-weight="${w||400}" fill="${f||'#1f2a37'}">${t}</text>`;
const FR=(x,y,w,h,f,s,sw,rx)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx===undefined?10:rx}" fill="${f||'#fff'}" stroke="${s||'#b8c2cf'}" stroke-width="${sw||2}"/>`;
const FKEY=(x,y,w,t,sz)=>`${FR(x,y,w,46,'#fff','#8a96a6',2,8)}${FT(x+w/2,y+30,t,sz||20,700)}`;
const FOK=(x,y)=>`<circle cx="${x}" cy="${y}" r="13" fill="#2e9e5b"/>${FT(x,y+6,'✓',18,800,'#fff')}`;
const FKO=(x,y)=>`<circle cx="${x}" cy="${y}" r="13" fill="#d33"/>${FT(x,y+6,'✕',16,800,'#fff')}`;
/* petit paisatge reutilitzable (sol i muntanya) dins d’un requadre x,y,w,h */
const FPAIS=(x,y,w,h)=>`<g><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#cfe8f7"/><circle cx="${x+w*0.78}" cy="${y+h*0.25}" r="${Math.min(w,h)*0.12}" fill="#f6c343"/><polygon points="${x},${y+h} ${x+w*0.38},${y+h*0.32} ${x+w*0.72},${y+h}" fill="#5b8c5a"/><polygon points="${x+w*0.45},${y+h} ${x+w*0.72},${y+h*0.5} ${x+w},${y+h}" fill="#3f6f4e"/></g>`;
