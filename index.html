<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cerquem bé! · Competència digital 1</title>
<style>
:root{color-scheme:light;--c:#0f9d9a;--cl:#dff6f5;--ink:#1f2a37;--mut:#5b6776;--bg:#f6f8fb;--ok:#1b8a3a;--okl:#e3f6e8;--ko:#c0392b;--kol:#fdecea;--warn:#b7791f;--warnl:#fff4d6}
body[data-c="inicial"]{--c:#e8830c;--cl:#fff0dc}
body[data-c="mitja"]{--c:#0f9d9a;--cl:#dff6f5}
body[data-c="superior"]{--c:#6a4fc7;--cl:#ece8fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:19px;line-height:1.45}
#app{max-width:920px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:34px;margin:.2em 0}h2{font-size:26px;margin:.3em 0}h3{font-size:21px;margin:.4em 0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.top .grow{flex:1}
.chip{display:inline-block;background:var(--cl);color:var(--ink);border-radius:20px;padding:3px 12px;font-size:15px;font-weight:700}
.card{background:#fff;border:2px solid #e3e8ef;border-radius:18px;padding:18px 20px;margin:12px 0;box-shadow:0 2px 0 #e3e8ef}
.card.hl{border-color:var(--c)}
.btn{display:inline-block;background:var(--c);color:#fff;border:0;border-radius:14px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.sec{background:#fff;color:var(--ink);border:2px solid #cfd6df;box-shadow:0 3px 0 #dfe4ea}
.btn.big{font-size:22px;padding:16px 30px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bubble{background:#fff;border:2px solid var(--c);border-radius:18px;padding:10px 16px;position:relative;flex:1}
label{display:block;font-weight:700;margin:12px 0 4px}
input[type=text],textarea,select{width:100%;font:inherit;padding:10px 12px;border:2px solid #cfd6df;border-radius:12px;background:#fff;color:#1f2a37;-webkit-text-fill-color:#1f2a37;caret-color:#1f2a37}
input::placeholder,textarea::placeholder{color:#7a8594;-webkit-text-fill-color:#7a8594;opacity:1}
option{background:#fff;color:#1f2a37}
button{color:inherit}
input:focus,textarea:focus,select:focus{outline:3px solid var(--cl);border-color:var(--c)}
.cicles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cc{border:3px solid #dbe1e8;border-radius:16px;padding:12px;background:#fff;cursor:pointer;text-align:center;font:inherit;color:var(--ink)}
.cc b{display:block;font-size:20px}.cc small{color:var(--mut);display:block;font-size:14px;margin-top:4px}
.cc.sel{border-color:var(--c);background:var(--cl)}
.cc[data-v=inicial].sel{border-color:#e8830c;background:#fff0dc}.cc[data-v=superior].sel{border-color:#6a4fc7;background:#ece8fb}
.steps{display:flex;gap:6px;margin:8px 0 14px;flex-wrap:wrap}
.stp{flex:1;min-width:110px;text-align:center;border-radius:12px;padding:6px 4px;font-size:14px;font-weight:700;background:#e9edf2;color:var(--mut);cursor:pointer;border:0;font-family:inherit}
.stp.on{background:var(--c);color:#fff}.stp.done{background:var(--cl);color:var(--ink)}
.toy{border:3px solid #9aa6b5;border-radius:14px;overflow:hidden;background:#fff;margin:10px 0;color:var(--ink)}
.toy .bar{background:#e4e9f0;padding:8px 10px;display:flex;gap:8px;align-items:center;font-size:15px;flex-wrap:wrap}
.toy .dots span{display:inline-block;width:10px;height:10px;border-radius:50%;background:#aab4c2;margin-right:3px}
.toy .url{flex:1;background:#fff;border-radius:20px;padding:4px 14px;border:1px solid #c5cdd8;color:var(--mut);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:120px}
.toy .body{padding:14px 18px}
.toy .b{cursor:pointer;padding:5px 12px;border-radius:10px;background:#fff;border:1px solid #c5cdd8;font-weight:700;font-size:20px}
.toy .b:hover,.toy .url[data-act]:hover,.lnk:hover{outline:3px solid var(--cl)}
.lnk{color:#1a5fd0;text-decoration:underline;cursor:pointer}
.locked{pointer-events:none}
.tok{display:inline-block;margin:4px;padding:6px 12px;border:2px solid #cfd6df;border-radius:12px;background:#fff;color:var(--ink);font:inherit;cursor:pointer}
.tok:disabled{color:var(--ink)}
.tok.sel{background:var(--cl);border-color:var(--c);font-weight:700}
.tok.ok{background:var(--okl);border-color:var(--ok)}.tok.ko{background:var(--kol);border-color:var(--ko)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 16px;border:2px solid #cfd6df;border-radius:14px;background:#fff;font:inherit;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--c)}.opt.ok{background:var(--okl);border-color:var(--ok)}.opt.ko{background:var(--kol);border-color:var(--ko);opacity:.75}
.opt.ord.sel{background:var(--cl);border-color:var(--c)}
.opt .n{display:inline-block;min-width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;text-align:center;font-weight:700;margin-right:8px;line-height:28px}
.fb{border-radius:12px;padding:10px 14px;margin:10px 0}.fb.ok{background:var(--okl)}.fb.ko{background:var(--kol)}.fb.hint{background:var(--warnl)}
kbd{display:inline-block;border:2px solid #9aa6b5;border-bottom-width:4px;border-radius:8px;background:#f4f6f9;padding:0 9px;font:700 .9em "Trebuchet MS",system-ui,sans-serif;color:var(--ink);line-height:1.5}
.logos{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0}
.lg{text-align:center;width:96px;font-size:14px}
.logo{width:56px;height:56px;object-fit:contain;display:block;margin:0 auto 4px;vertical-align:middle}
.logo.wide{width:120px;height:56px}
.lg.wide{width:140px}
.logo.sm.wide{width:auto;height:30px}
.logo.sm{width:30px;height:30px;display:inline-block;margin:0 8px 0 0}
.logo.ph{border:2px dashed #aab4c2;border-radius:12px;background:#f1f4f8;color:#7a8594;font-weight:700;font-size:11px;line-height:52px;text-align:center}
.logo.sm.ph{line-height:26px;font-size:9px}
.emo{display:flex;gap:10px;flex-wrap:wrap}
.sem{display:flex;align-items:center;gap:8px;border:3px solid #cfd6df;background:#fff;color:var(--ink);border-radius:30px;padding:6px 16px 6px 8px;font:inherit;font-weight:700;cursor:pointer}
.sem i{display:inline-block;width:30px;height:30px;border-radius:50%;opacity:.45;border:3px solid rgba(0,0,0,.25)}
.sem.g i{background:#2e9e4f}.sem.y i{background:#f2c200}.sem.r i{background:#d93a2f}
.sem.on{border-color:var(--ink);background:#f3f6fa}.sem.on i{opacity:1}
.sp{background:none;border:0;cursor:pointer;font-size:22px;padding:0 4px}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #e3e8ef;padding:8px 6px;text-align:left;vertical-align:top;font-size:17px}
.st{font-weight:700;white-space:nowrap}.st.assolit{color:var(--ok)}.st.dominat{color:#8a5a00}.st.proces{color:var(--warn)}.st.no{color:var(--mut)}
.prog{height:10px;background:#e3e8ef;border-radius:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--c)}
.back{background:var(--warnl);border:2px solid #f0c75c;border-radius:14px;padding:10px 14px;margin:10px 0}
.foot{margin-top:28px;font-size:13px;color:var(--mut)}
#peu{max-width:920px;margin:0 auto;padding:14px 16px 28px;border-top:2px solid #e3e8ef;font-size:14px;color:var(--mut);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
#peu .logos-m{display:flex;gap:14px;align-items:center}
#peu .logos-m img{height:44px;width:auto}
#peu .finan{width:100%;max-width:720px;height:auto;display:block}
#peu a{color:var(--c);font-weight:700}
@media print{#peu{border:0}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.cicles,.grid2{grid-template-columns:1fr}}
@media print{.noprint{display:none!important}body{background:#fff}}
</style>
</head>

'mitja-4':{
 puc:['Sé triar la font digital adequada per a cada necessitat','Puc analitzar una pàgina: autoria, font, data i finalitat','Puc comparar fonts i decidir quina informació és més fiable'],
 lessons:[
  {t:'Triar la font adequada',h:`Segons el que necessitem, hem de triar una font digital diferent.<br>📖 Un <b>diccionari digital</b> explica el significat, l’ortografia i els usos d’una paraula.<br>🌍 Una <b>enciclopèdia digital</b> resumeix un tema amb dades, dates i explicacions (per exemple, la Viquipèdia).<br>📚 Un <b>llibre digital</b> permet llegir una obra sencera a la pantalla.<br>📰 La <b>premsa digital</b> explica fets que han passat fa poc.`},
  {t:'Analitzar una pàgina: 4 preguntes',h:`Abans de fer servir una informació, ens preguntem:<br>1️⃣ <b>Qui ho ha escrit?</b> (autoria)<br>2️⃣ <b>D’on ve?</b> (font: museu, escola, institució…)<br>3️⃣ <b>De quan és?</b> (data d’actualització)<br>4️⃣ <b>Per què ho han escrit?</b> (finalitat: informar, ensenyar, vendre o convèncer)<br>Si falten pistes o la finalitat és vendre, hem de ser prudents.`},
  {t:'Comparar fonts',h:`Una sola pàgina no sempre és prou. Si <b>dues o tres pàgines fiables</b> expliquen el mateix, la informació és més segura.<br>Si una pàgina diu una cosa molt diferent de totes les altres, i a sobre no diu qui l’ha escrit, cal <b>desconfiar-ne</b>.<br>Si dues pàgines fiables donen dades diferents, ens quedem amb la <b>més recent</b>.`}],
 items:[
  ch('F1','fonts','Una nena vol saber què vol dir la paraula <b>gresol</b>, com s’escriu i en quines frases es pot fer servir. <b>Quina font digital l’ajudarà més?</b>',['Un llibre digital de contes','Un diccionari digital','La premsa digital'],1,'Busca la font que explica paraules.','Un diccionari digital explica el significat, l’ortografia i els usos de cada paraula.'),

  ch('F3','fonts','Vols saber què ha passat <b>aquest cap de setmana</b> a la teva ciutat. <b>Quina font és més adequada i per què?</b>',['Una enciclopèdia digital, perquè resumeix els temes','La premsa digital, perquè explica fets recents','Un diccionari digital, perquè explica paraules'],1,'Es tracta d’un fet molt recent.','La premsa digital explica fets que han passat fa poc.'),

  ch('V1','validesa','<b>Llegeix la pàgina.</b> D’on ve el color rosat dels flamencs? I pots fiar-te’n?',['Ve de l’aigua salada; no m’hi fio perquè no té data','Ve dels pigments dels crustacis i les algues que mengen; m’hi fio perquè té autora, font i data','Ve de la seva edat; m’hi fio perquè és una pàgina oficial'],1,'Llegeix el text i mira les quatre pistes.','El text explica que el color ve dels pigments dels crustacis i les algues, i la pàgina té autora, font i data.',{html:pageBox(pg('parc-delta.exemple/flamencs','Per què els flamencs són rosats?','Dra. Marta Roca, biòloga','Març de 2025','Web oficial del Parc Natural','El color rosat dels flamencs ve dels pigments que obtenen dels crustacis i de les algues de què s’alimenten. Els pollets neixen grisos.'))}),

const plain=h=>{let t=String(h).replace(/%%row:[\w,]+%%/g,' ').replace(/\[\[logo:\w+\]\]/g,'').replace(/\[\[key:([^\]]+)\]\]/g,'$1').replace(/<br>/g,'. ').replace(/<[^>]+>/g,'');
  SYM.forEach(([a,b])=>{t=t.replace(a,b)});
  return t.replace(/[⃣️‍]/g,'').replace(/\p{Extended_Pictographic}/gu,' ').replace(/\s+/g,' ').replace(/\s+([.,:;?!])/g,'$1').replace(/:\s*\./g,'.').replace(/([?!…])\./g,'$1').replace(/\.\s*\./g,'.').trim()};
const BRANDS=/(Google Chrome|Google Acadèmic|Wikimedia Commons|Freesound|DuckDuckGo|Startpage|Firefox|Safari|Google|Chrome|Bing|Edge|Word|Excel)/;
const MASCOT=`<svg viewBox="0 0 100 100" width="70" height="70" aria-hidden="true"><circle cx="46" cy="52" r="34" fill="var(--c)"/><circle cx="34" cy="46" r="10" fill="#fff"/><circle cx="58" cy="46" r="10" fill="#fff"/><circle cx="36" cy="48" r="5" fill="#223"/><circle cx="60" cy="48" r="5" fill="#223"/><path d="M36 66q10 9 22 0" stroke="#223" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="76" cy="70" r="13" fill="rgba(255,255,255,.6)" stroke="#223" stroke-width="4"/><line x1="85" y1="80" x2="96" y2="92" stroke="#223" stroke-width="6" stroke-linecap="round"/></svg>`;
const bubble=t=>`<div class="top"><div>${MASCOT}</div><div class="bubble">${t}</div></div>`;
const speak=t=>{try{speechSynthesis.cancel();t.split(BRANDS).forEach((seg,i)=>{if(!seg.trim())return;const u=new SpeechSynthesisUtterance(seg.trim());u.lang=i%2?'en-US':'ca-ES';u.rate=.9;speechSynthesis.speak(u)})}catch(e){}};
const spBtn=t=>`<button class="sp noprint" data-act="speak" data-t="${esc(plain(t))}" title="Escolta">🔊</button>`;
const resetQ=()=>{S.tok=[];S.ord=[];S.fb=null;S.hint=false};

/* ============ LÒGICA D'ESTAT ============ */
function saberState(k,cs,sab){
  const its=cs.items.filter(i=>i.saber===sab.id);
  const r=S.res[k]||{};
  const done=its.filter(i=>r[i.id]&&r[i.id].done).length;
  if(!done)return{st:'no',done:0,n:its.length};
  const c=its.filter(i=>r[i.id]&&r[i.id].first===true).length;
  const pct=c/its.length;
  const hints=its.some(i=>r[i.id]&&r[i.id].hint);
  const realOk=!!cs.sabers[sab.id].realDone(S.real[k]||{});
  let st='proces';
  if(done===its.length&&pct>=.7)st='assolit';
  if(done===its.length&&pct>=.9&&!hints&&realOk)st='dominat';
  return{st,pct,c,n:its.length,done,hints,realOk};
}
function sessionStatus(k){
  const cs=CONTENT[k];if(!cs)return null;
  const s=sessOf(k);const sts=s.sabers.map(sb=>saberState(k,cs,sb).st);
  if(sts.every(x=>x==='no'))return'no';
  return sts.every(x=>x==='assolit'||x==='dominat')?'fet':'proces';
}

/* ============ PANTALLES ============ */
function vInici(){
  const c=CICLES[S.cicle];
  return `<div class="top"><div>${MASCOT}</div><div class="grow"><h1>Cerquem bé!</h1><span class="chip">Competència digital 1 · Navegadors i cerca per internet</span></div></div>
  <div class="card">
    <label>${c.parella?'Nom i cognoms (alumne/a 1)':'Nom i cognoms'}</label>
    <input type="text" data-k="n1" value="${esc(S.n1)}" autocomplete="off">
    ${c.parella?`<label>Nom i cognoms (alumne/a 2)</label><input type="text" data-k="n2" value="${esc(S.n2)}" autocomplete="off">`:''}
    <label>Sobre quin tema vols investigar?</label>
    <input type="text" data-k="tema" value="${esc(S.tema)}" placeholder="Per exemple: els llops" autocomplete="off">
    <label>Tria el teu nivell</label>
    <div class="cicles">${Object.entries(CICLES).map(([k,v])=>`<button class="cc ${S.cicle===k?'sel':''}" data-act="cicle" data-v="${k}"><b>${v.nom}</b>${v.cursos}<small>${v.parella?'En parella':'Individual'} · ${SESSIONS[k].length} sessions</small></button>`).join('')}</div>
    ${S.err?`<div class="fb ko">${esc(S.err)}</div>`:''}
    <p style="margin-top:18px"><button class="btn big" data-act="start">Comencem →</button></p>
  </div>`;
}
function vComFunciona(){
  return `${bubble('Hola! Soc la Lupa. Et faré companyia mentre cerques.')}
  <div class="card"><h2>Com funciona?</h2>
   <div class="grid2">
    <div class="card hl"><h3>📑 Pestanya 1: jo</h3>Aquí tens el <b>pas a pas</b>: aprens, practiques i apuntes el que has fet.</div>
    <div class="card hl"><h3>🔎 Pestanya 2: cercar</h3>Quan t’ho digui, <b>obriràs el cercador</b> en una pestanya nova i faràs la cerca real.</div>
   </div>
   <p>👉 Quan acabis de cercar, <b>torna a aquesta pestanya</b>. Jo m’adonaré que has tornat.</p>
   <p>💡 Si no ho saps, prem <b>Pista</b>. 🔊 llegeix el text en veu alta.</p>
   <p>Al final prem <b>«Mostra l’estat»</b> i ensenya-ho al professorat.</p>
   <p><button class="btn big" data-act="go" data-v="menu">Entesos →</button></p></div>`;
}
function header(extra){
  const c=CICLES[S.cicle];
  return `<div class="top noprint"><div>${MASCOT}</div><div class="grow"><b>${esc(S.n1)}${S.n2?' i '+esc(S.n2):''}</b><br><span class="chip">${c.nom}</span> <span class="chip">Tema: ${esc(S.tema)}</span></div>${extra||''}</div>`;
}
function vMenu(){
  const list=SESSIONS[S.cicle];
  return header(`<button class="btn sec" data-act="go" data-v="com">?</button><button class="btn sec" data-act="go" data-v="estat">Mostra l’estat</button>`)+
  `<h2>Triem sessió</h2><p>Comença per l’ordre (1, 2, 3…). Si ja has fet alguna sessió, el professorat et dirà per quina vas.</p>`+
  list.map(s=>{
    const k=skey(S.cicle,s.id),st=sessionStatus(k);
    return `<div class="card hl"><div class="row"><div class="grow" style="flex:1"><h3>${s.id}. ${esc(s.titol)} ${st==='fet'?'✅':st==='proces'?'🔄':''}</h3><small style="color:var(--mut)">${esc(s.sabers.map(x=>x.text).join(' · '))}</small></div>
    <button class="btn" data-act="open" data-i="${s.id}">${st&&st!=='no'?'Continuar':'Començar'}</button></div></div>`;}).join('')+
  `<p class="noprint"><button class="btn sec" data-act="go" data-v="inici">← Canvia de nivell o de tema</button></p>`;
}
function stepper(){
  return `<div class="steps noprint">${STEPS.map((t,i)=>`<button class="stp ${i===S.step?'on':i<S.step?'done':''}" data-act="step" data-v="${i}">${i+1}. ${t}</button>`).join('')}</div>`;
}
function vSessio(){
  const k=S.sk,s=sessOf(k),cs=CONTENT[k];
  let h=header(`<button class="btn sec" data-act="go" data-v="menu">☰ Menú</button>`)+`<h2>${s.id}. ${esc(s.titol)}</h2>`+stepper();
  const self=S.self[k]||(S.self[k]={pre:[],post:[]});
  const emo=(g)=>cs.puc.map((p,i)=>`<div class="card"><div>${esc(p)}</div><div class="emo" style="margin-top:6px">${[[3,'g','Ho sé fer'],[2,'y','Una mica'],[1,'r','Encara no']].map(([v,cl,t])=>`<button class="sem ${cl} ${self[g][i]===v?'on':''}" data-act="self" data-g="${g}" data-i="${i}" data-v="${v}"><i></i>${t}</button>`).join('')}</div></div>`).join('');
  if(S.step===0){
    h+=bubble('Avui aprendràs això. Abans de començar, digues com et veus: 🟢 ho sé fer · 🟡 una mica · 🔴 encara no.')+emo('pre');
    h+=`<p><button class="btn big" data-act="next">Anem-hi →</button></p>`;
  }else if(S.step===1){
    h+=bubble('Llegeix (o escolta 🔊) i després practicarem.')+cs.lessons.map(l=>`<div class="card hl"><h3>${l.t} ${spBtn(l.t+'. '+l.h)}</h3><div>${fx(l.h)}</div></div>`).join('');
    h+=`<p><button class="btn sec" data-act="prev">← Enrere</button> <button class="btn big" data-act="next">A practicar →</button></p>`;
  }else if(S.step===2){
    h+=vPractica(k,cs);
  }else if(S.step===3){
    h+=bubble('Ara toca cercar de debò!')+`<div class="card hl"><h3>🔎 Fes-ho tu</h3><p>${cs.real.intro}</p>
      <p><a class="btn big" href="${SEARCH_URL}" target="_blank" rel="noopener" data-act="opened">🔎 Obre el cercador (pestanya nova)</a></p>
      <p style="color:var(--mut)">Quan acabis, <b>torna a aquesta pestanya</b> i omple el quadre.</p></div>`;
    if(S.back)h+=`<div class="back">👋 Ja has tornat! Omple el quadre de sota amb el que has fet.</div>`;
    const r=S.real[k]||{};
    h+=`<div class="card" id="realform"><h3>📝 El que he fet</h3>${cs.real.fields.map(f=>f.type==='text'?`<label>${f.label}</label><input type="text" data-k="real.${k}.${f.k}" value="${esc(r[f.k])}" autocomplete="off">`:`<label>${f.label}</label><select data-k="real.${k}.${f.k}"><option value="">— tria —</option>${f.opts.map(o=>`<option ${r[f.k]===o?'selected':''}>${o}</option>`).join('')}</select>`).join('')}</div>`;
    h+=`<p><button class="btn sec" data-act="prev">← Enrere</button> <button class="btn big" data-act="next">Següent →</button></p>`;
  }else{
    h+=bubble('Molt bé! Mira com et veus ara i després ensenya l’estat al professorat.')+emo('post');
    h+=`<p><button class="btn big" data-act="go" data-v="estat">📋 Mostra l’estat</button> <button class="btn sec" data-act="go" data-v="menu">← Menú</button></p>`;
  }
  return h;
}
function vPractica(k,cs){
  const items=cs.items,n=items.length;
  if(S.item>=n)return bubble('Has acabat la pràctica! 🎉')+`<div class="card"><p>Ara passarem a cercar de debò.</p><button class="btn sec" data-act="restart">Repetir la pràctica</button> <button class="btn big" data-act="next">Fes-ho tu →</button></div>`;
  const it=items[S.item],r=(S.res[k]=S.res[k]||{}),ir=(r[it.id]=r[it.id]||{first:null,hint:false,done:false});
  let h=`<div class="prog"><i style="width:${S.item/n*100}%"></i></div><p style="margin:6px 0"><small>Pregunta ${S.item+1} de ${n}</small></p>`;
  const need=it.type==='words'?it.correct.length:0;
  const pr=it.type==='words'?`Vols respondre aquesta pregunta: <i>«${esc(it.words.join(' ')+it.end)}»</i><br>Toca les <b>${need} paraules clau</b> que escriuries al cercador.`:it.prompt;
  let body=`<div style="margin-bottom:6px">${fx(pr)} ${spBtn(pr)}</div>`;
  if(it.html&&it.type==='choice')body+=it.html;
  if(it.type==='words'){
    body=`<div class="toy"><div class="bar"><span class="dots"><span></span><span></span><span></span></span><span class="url">🔎 Paraules clau per cercar…</span></div><div class="body">${body}<div style="font-size:23px;margin-top:8px">${it.words.map((w,i)=>{const sel=S.tok.includes(i);const good=it.correct.includes(w.toLowerCase());return `<button class="tok ${ir.done?(good?'ok':''):sel?'sel':''}" data-act="tok" data-i="${i}" ${ir.done?'disabled':''}>${esc(w)}</button>`}).join('')}${esc(it.end)}</div></div></div>`;
    if(!ir.done)body+=`<p><button class="btn" data-act="check" ${S.tok.length===need?'':'disabled'}>Comprova</button> <span style="color:var(--mut)">Has triat ${S.tok.length} de ${need}</span></p>`;
  }else if(it.type==='clic'){
    body+=`<div class="${ir.done?'locked':''}">${it.html}</div>`+(ir.done?`<style>.toy [data-id="${it.target}"]{outline:3px solid var(--ok);border-radius:8px}</style>`:'');
  }else if(it.type==='ordre'){
    body+=it.steps.map((t,i)=>{const p=S.ord.indexOf(i);return `<button class="opt ord ${p>=0?'sel':''}" data-act="ord" data-i="${i}" ${ir.done?'disabled':''}>${p>=0?`<span class="n">${p+1}</span>`:''}${fx(esc(t))}</button>`}).join('');
    if(!ir.done)body+=`<p><button class="btn" data-act="check" ${S.ord.length===it.steps.length?'':'disabled'}>Comprova</button> <button class="btn sec" data-act="ordreset">Torna a començar</button></p>`;
  }else{
    body+=it.opts.map((o,i)=>{const bad=(S.fb&&S.fb.bad||[]).includes(i);const good=ir.done&&i===it.ok;return `<button class="opt ${good?'ok':bad?'ko':''}" data-act="opt" data-i="${i}" ${ir.done?'disabled':''}>${fx(esc(o))}</button>`}).join('');
  }
  if(S.hint)body+=`<div class="fb hint">💡 ${fx(esc(it.hint))}</div>`;
  if(S.fb&&S.fb.msg)body+=`<div class="fb ${S.fb.ok?'ok':'ko'}">${S.fb.ok?'✅ ':'❌ '}${S.fb.msg}</div>`;
  if(!ir.done)body+=`<p><button class="btn sec" data-act="hint">💡 Pista</button></p>`;
  else body+=`<p><button class="btn big" data-act="nextitem">${S.item===n-1?'Acabar':'Següent'} →</button></p>`;
  return h+`<div class="card hl">${body}</div><p><button class="btn sec" data-act="prev">← Enrere</button></p>`;
}
function summaryText(k,cs){
  const s=sessOf(k);
  return s.sabers.map(sb=>{const q=saberState(k,cs,sb);return `${sb.text.split(' (')[0]}: ${ST_LAB[q.st]}${q.n&&q.done?` (${Math.round(q.pct*100)}%${q.hints?', amb pistes':''}${q.st==='dominat'?', pendent de confirmar':''})`:''}`}).join(' | ');
}
function vEstat(){
  const d=new Date().toLocaleDateString('ca-ES');
  const c=CICLES[S.cicle];
  const keys=SESSIONS[S.cicle].map(s=>skey(S.cicle,s.id)).filter(k=>CONTENT[k]&&sessionStatus(k)&&sessionStatus(k)!=='no');
  let h=header(`<span class="noprint"></span>`)+`<h2>📋 Estat</h2><div class="card hl"><table>
    <tr><th>Alumnat</th><td>${esc(S.n1)}${S.n2?' i '+esc(S.n2):''}</td></tr>
    <tr><th>Nivell</th><td>${c.nom} (${c.cursos})</td></tr><tr><th>Tema</th><td>${esc(S.tema)}</td></tr><tr><th>Data</th><td>${d}</td></tr></table></div>`;
  if(!keys.length)h+=`<div class="card">Encara no has fet cap activitat.</div>`;
  let txt='';
  keys.forEach(k=>{
    const cs=CONTENT[k],s=sessOf(k),self=S.self[k]||{pre:[],post:[]};
    h+=`<div class="card"><h3>Sessió ${s.id}. ${esc(s.titol)}</h3><table><tr><th>Saber</th><th>Estat</th><th>Detall</th></tr>`+
    s.sabers.map(sb=>{const q=saberState(k,cs,sb);
      const det=q.done?`${q.c} de ${q.n} bé a la primera (${Math.round(q.pct*100)}%)<br>${q.hints?'Ha fet servir pistes':'Sense pistes'} · ${q.realOk?'Fitxa de cerca feta':'Falta la cerca real'}${q.st==='dominat'?'<br>☐ Confirmat pel docent':''}`:'';
      return `<tr><td>${esc(sb.text)} <small>(${sb.ca})</small></td><td class="st ${q.st}">${ST_LAB[q.st]}</td><td><small>${det}</small></td></tr>`}).join('')+`</table>`;
    const pre=self.pre,post=self.post,E=['','🔴','🟡','🟢'];
    if(pre.length||post.length)h+=`<p><small>Com es veu: abans ${pre.map(v=>E[v]||'·').join(' ')} → després ${post.length?post.map(v=>E[v]||'·').join(' '):'(encara no)'}</small></p>`;
    h+=`</div>`;
    txt+=`${S.n1}${S.n2?' i '+S.n2:''} · ${c.nom} · Sessió ${s.id} · ${d} · Tema: ${S.tema} · ${summaryText(k,cs)}\n`;
  });
  window.__txt=txt;
  h+=`<div class="card noprint" style="font-size:16px"><b>Com es calcula l’estat de cada saber</b>
  <p style="margin:6px 0">Es compten només les preguntes encertades <b>a la primera</b>.</p>
  <table>
   <tr><td class="st no">○ No fet</td><td>Encara no ha fet cap pregunta d’aquest saber.</td></tr>
   <tr><td class="st proces">🔄 En procés</td><td>Ha fet preguntes, però no ha encertat a la primera 7 de cada 10, o encara no les ha acabades totes.</td></tr>
   <tr><td class="st assolit">✔ Assolit</td><td>Ha acabat les preguntes i n’ha encertat a la primera <b>7 de cada 10 o més</b>. Pot haver fet servir pistes (és a dir, ho fa amb ajuda).</td></tr>
   <tr><td class="st dominat">⭐ Dominat</td><td>Ha encertat a la primera <b>9 de cada 10 o més</b>, <b>sense cap pista</b>, i ha fet la cerca real (fitxa). L’app només ho proposa: el docent ho confirma marcant la casella ☐.</td></tr>
  </table></div>
  <p class="noprint"><button class="btn" data-act="copy">📎 Copia el resum</button> <button class="btn sec" data-act="go" data-v="menu">← Torna al menú</button></p><div id="copied" class="noprint"></div>`;
  return h;
}
function render(){
  document.body.dataset.c=S.cicle;
  const v={inici:vInici,com:vComFunciona,menu:vMenu,sessio:vSessio,estat:vEstat}[S.screen];
  $app.innerHTML=v();
  window.scrollTo(0,0);
}

/* ============ EVENTS ============ */
function setPath(p,v){const a=p.split('.');let o=S;for(let i=0;i<a.length-1;i++){o=o[a[i]]=o[a[i]]||{}}o[a[a.length-1]]=v}
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)setPath(k,e.target.value)});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)setPath(k,e.target.value)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.screen==='sessio'&&S.step===3&&S.opened){S.back=true;render();const f=document.getElementById('realform');if(f)f.scrollIntoView({behavior:'smooth'})}});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,d=b.dataset;
  const k=S.sk,cs=k&&CONTENT[k];
  if(a==='speak'){speak(d.t);return}
  if(a==='opened'){S.opened=true;return}
  const mark=(it,ir,ok,okMsg,koMsg,bad)=>{if(ir.first===null)ir.first=ok;if(ok){ir.done=true;S.fb={ok:true,msg:fx(okMsg)}}else S.fb={ok:false,msg:koMsg,bad:bad||[]};render()};
  if(a==='cicle'){S.cicle=d.v;render()}
  else if(a==='start'){if(!S.n1.trim()||!S.tema.trim()){S.err='Escriu el teu nom i el tema per començar.';render();return}S.err='';S.screen='com';render()}
  else if(a==='go'){S.screen=d.v;render()}
  else if(a==='open'){S.sk=skey(S.cicle,d.i);S.screen='sessio';S.step=0;S.item=0;resetQ();S.back=false;S.opened=false;render()}
  else if(a==='step'){S.step=+d.v;resetQ();render()}
  else if(a==='next'){S.step=Math.min(4,S.step+1);resetQ();render()}
  else if(a==='prev'){S.step=Math.max(0,S.step-1);render()}
  else if(a==='restart'){S.item=0;S.res[k]={};resetQ();render()}
  else if(a==='self'){const s=S.self[k]||(S.self[k]={pre:[],post:[]});s[d.g][+d.i]=+d.v;render()}
  else if(a==='tok'){const i=+d.i;S.tok=S.tok.includes(i)?S.tok.filter(x=>x!==i):[...S.tok,i];S.fb=null;render()}
  else if(a==='ord'){const i=+d.i,p=S.ord.indexOf(i);S.ord=p>=0?S.ord.slice(0,p):[...S.ord,i];S.fb=null;render()}
  else if(a==='ordreset'){S.ord=[];S.fb=null;render()}
  else if(a==='hint'){const it=cs.items[S.item];S.res[k][it.id].hint=true;S.hint=true;render()}
  else if(a==='check'){
    const it=cs.items[S.item],ir=S.res[k][it.id];
    let ok;
    if(it.type==='ordre')ok=S.ord.length===it.order.length&&S.ord.every((x,i)=>x===it.order[i]);
    else{const sel=S.tok.map(i=>it.words[i].toLowerCase()).sort(),cor=it.correct.map(x=>x.toLowerCase()).sort();ok=sel.length===cor.length&&sel.every((x,i)=>x===cor[i])}
    mark(it,ir,ok,esc(it.expl),it.type==='ordre'?'Gairebé! Torna-ho a provar.':'Gairebé! Torna-ho a provar (pots fer servir la pista).')}
  else if(a==='opt'){const it=cs.items[S.item],ir=S.res[k][it.id],i=+d.i;mark(it,ir,i===it.ok,esc(it.expl),'Torna-ho a provar.',[...((S.fb&&S.fb.bad)||[]),i])}
  else if(a==='clic'){const it=cs.items[S.item],ir=S.res[k][it.id];if(ir.done)return;mark(it,ir,d.id===it.target,esc(it.expl),'Aquest no és. Torna-ho a provar.')}
  else if(a==='nextitem'){S.item++;resetQ();render()}
  else if(a==='copy'){const t=window.__txt||'';const m=document.getElementById('copied');
    try{navigator.clipboard.writeText(t).then(()=>{m.innerHTML='<div class="fb ok">Resum copiat. Enganxa’l a la plantilla.</div>'},()=>{m.innerHTML='<div class="fb hint">No s’ha pogut copiar. Selecciona el text:<br><textarea rows="4" readonly>'+esc(t)+'</textarea></div>'})}
    catch(err){m.innerHTML='<div class="fb hint"><textarea rows="4" readonly>'+esc(t)+'</textarea></div>'}}
});
render();
