/* Teclat (distribució espanyola/catalana) amb tecles ressaltades. sel: {idTecla: número d’etiqueta} */
function kbCatSVG(sel,row5){
  const u=40,k=37;
  const Q=['Q','W','E','R','T','Y','U','I','O','P'];
  const rows=[
   {y:12,x:20,keys:[['º'],['1'],['2'],['3','tres'],['4'],['5'],['6'],['7'],['8'],['9'],['0'],['’','apos'],['¡']],tail:['⌫',58]},
   {y:56,x:20,lead:['Tab',54],keys:Q.map(c=>[c]).concat([['`','obert'],['+']])},
   {y:100,x:20,lead:['Bloq Maj',66,'bloq'],keys:['A','S','D','F','G','H','J','K','L','Ñ'].map(c=>[c]).concat([['´','tancat'],['Ç','ce']])},
   {y:144,x:20,lead:['⇧',50,'maj'],keys:[['<'],['Z'],['X'],['C'],['V'],['B'],['N'],['M'],[','],['.'],['-','guio']],tail:['⇧',88,'maj2']}];
  const key=(x,y,w,t,id,fs)=>{const on=sel&&id&&sel[id];return `<rect x="${x}" y="${y}" width="${w}" height="${k}" rx="7" fill="${on?'#ffe0b2':'#fff'}" stroke="${on?'#e8830c':'#b8c2cf'}" stroke-width="${on?3:2}"/>${FT(x+w/2,y+25,t,fs||(t.length>3?13:17),700)}${on?badge(x+w-4,y+4,sel[id]):''}`};
  let out='';
  rows.forEach(r=>{let x=r.x;
    if(r.lead){out+=key(x,r.y,r.lead[1]-3,r.lead[0],r.lead[2],12);x+=r.lead[1];}
    r.keys.forEach(kk=>{const id=kk[1]||(kk[0].length===1?kk[0]:'');out+=key(x,r.y,k,kk[0],id);x+=u;});
    if(r.tail){const id=r.tail[2];out+=key(x,r.y,r.tail[1]-3,r.tail[0],id&&(id==='maj2'?'maj':id),r.tail[0]==='⌫'?16:17);}
  });
  let h=196;
  if(row5){
    const y=188;
    out+=key(20,y,56,'Ctrl','ctrl',13)+key(80,y,40,'Win','',11)+key(124,y,46,'Alt','',13)+`<rect x="174" y="${y}" width="230" height="${k}" rx="7" fill="#fff" stroke="#b8c2cf" stroke-width="2"/>${FT(289,y+25,'Espai',14,700)}`+key(408,y,56,'AltGr','',13)+key(468,y,40,'Win','',11)+key(512,y,56,'Ctrl','ctrl2',13);
    h=240;
  }
  return FS(h,'Teclat amb les tecles que es fan servir ressaltades',out);
}
function figTecladCat(mode){
  const note='<p style="margin:6px 0 0;font-size:15px;color:var(--mut)">Teclat espanyol o català. Si el teu és diferent, les tecles poden canviar de lloc.</p>';
  if(mode==='accents')return kbCatSVG({obert:1,tancat:2})+legend(['<b>Accent obert</b> (à è ò): tecla <b>`</b>, a la dreta de la P. Prem-la <b>i deixa-la</b>; després prem la vocal.','<b>Accent tancat</b> (é í ó ú): tecla <b>´</b>, a la dreta de la Ñ. Prem-la i deixa-la; després prem la vocal.'])+note;
  if(mode==='apos')return kbCatSVG({apos:1,guio:2,tres:3,maj:3})+legend(['<b>Apòstrof</b> (’): tecla a la dreta del 0, a la fila dels números.','<b>Guionet</b> (-): tecla a baix a la dreta, al costat del punt.','<b>Punt volat</b> (·) per a la <b>l·l</b>: prem <b>⇧</b> i la tecla del <b>3</b>.'])+note;
  if(mode==='dieresi')return kbCatSVG({tancat:1,maj:1,ce:2})+legend(['<b>Dieresi</b> (ï ü): prem <b>⇧</b> i la tecla <b>´</b>; després la <b>i</b> o la <b>u</b>.','<b>Ç</b> (ce trencada): té la seva tecla, a la dreta de la ´.'])+note;
  return kbCatSVG({maj:1,bloq:2})+legend(['<b>⇧ Majúscula</b>: la prems <b>mentre</b> prems la lletra (una sola majúscula).','<b>Bloq Maj</b>: activa la majúscula fixa; per desactivar-la, torna-la a prémer.'])+note;
}

 items:[
  ch('G1','doc','Per a una <b>recepta</b> amb passos, quina llista és millor?',['Numerada','Amb vinyetes','Cap'],0,'L’ordre importa.','Una llista numerada serveix quan l’ordre importa.'),
  ch('G2','doc','Per a una llista de <b>ingredients</b>, quina llista és millor?',['Amb vinyetes','Numerada','Un paràgraf sense separar'],0,'L’ordre no importa.','Amb vinyetes quan l’ordre no importa.'),
  ch('G3','doc','Vols que un apartat <b>comenci en una pàgina nova</b>. Què és millor?',['Un salt de pàgina','Prémer Intro moltes vegades','Esborrar el text'],0,'Una eina pensada per això.','El salt de pàgina és més net i no es descol·loca.'),
  ch('G4','doc','El document té una part en <b>anglès</b> i el corrector la marca en vermell. Què fas?',['Canvio l’idioma d’aquesta part','L’esborro','Ignoro el corrector sempre'],0,'No és una falta, és un altre idioma.','Cal canviar l’idioma d’aquesta part perquè no es marqui com a falta.'),
  ch('G5','doc','Una taula és <b>massa ampla</b> per a la pàgina. Què pots provar?',['Canviar l’orientació a horitzontal','Fer la lletra més gran','Esborrar columnes'],0,'La pàgina serà més ampla.','L’orientació horitzontal dona més amplada.'),
  ch('G6','doc','Per què és útil la <b>vista prèvia</b> abans d’imprimir?',['Per veure com quedarà i no malgastar paper','Per canviar el nom','Per esborrar el document'],0,'Una mirada abans.','La vista prèvia evita imprimir amb errors.'),
  ch('G7','doc','El corrector no marca una paraula, però està malament escrita («<i>cassa</i>» en lloc de «<i>casa</i>»). Per què?',['Perquè «cassa» també existeix i el corrector no sap quina volies','Perquè el corrector no funciona','Perquè no cal revisar'],0,'Pensa en paraules que existeixen.','El corrector no entén el significat: cal rellegir.')],
 sabers:{doc:{realDone:req(['g1','g2','g3'])}},
 real:{blocks:[
   {h:'<b>1.</b> Crea un document sobre el teu tema amb <b>títol, almenys dos apartats</b> i <b>pàgines numerades</b>.',fields:['g1']},
   {h:'<b>2.</b> Afegeix una <b>llista numerada</b> o una <b>llista amb vinyetes</b> i fes un <b>salt de pàgina</b> abans de l’últim apartat.',fields:['g2']},
   {h:'<b>3.</b> Passa el corrector, comprova la vista prèvia d’impressió i apunta quantes faltes has corregit.',fields:['g3']}],
  fields:[{k:'g1',type:'check',label:'Què té el document?',opts:['Títol','Dos apartats o més','Pàgines numerades']},
   {k:'g2',type:'select',label:'Quina llista has fet servir?',opts:['Numerada','Amb vinyetes','Cap']},
   {k:'g3',type:'text',label:'Faltes corregides'}]}},

'cd2-superior-3':{
 puc:['Sé triar entre taula, gràfica i esquema segons la informació','Sé combinar cel·les i ajustar files i columnes','Sé inserir una gràfica a partir d’una taula'],
 lessons:[
  {t:'Taula, gràfica o esquema?',h:`<b>Taula</b>: per comparar o consultar <b>dades exactes</b> (quantitat per animal).<br><b>Gràfica</b>: per veure <b>com canvien</b> les dades o <b>quina és més gran</b> d’un cop d’ull (per exemple, l’augment de la temperatura al llarg dels anys).<br><b>Esquema</b>: per mostrar <b>relacions</b> entre idees.<br>Decideix què vols que l’altra persona entengui <b>primer</b>.`,fig:()=>figGrafiques()},
  {t:'Combinar cel·les i ajustar la taula',h:`Pots <b>combinar cel·les</b> perquè una gran ocupi diverses columnes, per exemple per a un títol que abraça tota la taula.<br>Pots <b>ajustar la mida</b> de files i columnes arrossegant les vores: fes-les de la mida del contingut, ni massa grans ni massa petites.<table class="lic"><tr><th colspan="2">Animals del bosc</th></tr><tr><th>Animal</th><th>Què menja</th></tr><tr><td>Llop</td><td>Carn</td></tr></table>`},
  {t:'De taula a gràfica',h:`Per fer una <b>gràfica</b>: 1) escriu les dades en una <b>taula</b>; 2) selecciona-les; 3) a <b>Insereix → Gràfica</b> tria el tipus (barres, línies, sectors); 4) posa-li un <b>títol</b> i indica què representa cada eix.<br>Una gràfica sense títol no s’entén.`},
  {t:'Quin tipus de gràfica?',h:`<b>Barres</b>: compara quantitats entre grups.<br><b>Línies</b>: mostra l’evolució amb el temps.<br><b>Sectors</b> (com un formatge 🧀): mostra les parts d’un total (sumen el 100 %).`}],
 items:[
  ch('T1','taules','Vols mostrar <b>com ha pujat la temperatura</b> any rere any. Què és millor?',['Una gràfica de línies','Un esquema','Un text llarg'],0,'Evolució al llarg del temps.','Les línies mostren l’evolució amb el temps.'),
  ch('T2','taules','Vols comparar el <b>pes</b> de cinc animals. Què és millor?',['Una gràfica de barres','Un paràgraf','Una imatge sola'],0,'Quantitats entre grups.','Les barres comparen quantitats entre grups.'),
  ch('T3','taules','Una cel·la <b>combinada</b> serveix per…',['ocupar diverses columnes, per exemple un títol','esborrar la taula','canviar el color'],0,'Com unir quadrats.','Combinar cel·les uneix diverses cel·les en una.'),
  ch('T4','taules','Quin tipus de gràfica és millor per mostrar <b>quina part del total</b> ocupa cada cosa?',['Sectors','Línies','Barres sempre'],0,'Pensa en un formatge tallat en parts.','Els sectors mostren parts d’un total.'),
  ch('T5','taules','Una gràfica no té <b>títol</b> ni indicacions. Què passa?',['No s’entén què representa','Es veu millor','És més exacta'],0,'Cal context.','Una gràfica sempre necessita títol i eixos clars.'),
  ch('T6','taules','Per fer una gràfica, normalment, primer cal…',['tenir les dades en una taula','escollir el color','imprimir'],0,'Les dades van primer.','La gràfica surt de les dades d’una taula.'),
  ch('T7','taules','Vols mostrar <b>com es relacionen</b> els fets d’una història (qui fa què). Què és millor?',['Un esquema','Una gràfica de línies','Una taula de nombres'],0,'Relacions entre idees.','Un esquema mostra relacions.')],
 sabers:{taules:{realDone:req(['t1','t2','t3'])}},
 real:{blocks:[
   {h:'<b>1.</b> Fes una <b>taula</b> amb dades del teu tema (almenys tres files) i <b>combina cel·les</b> per a un títol.',fields:['t1']},
   {h:'<b>2.</b> Fes una <b>gràfica</b> a partir de la taula. Quin tipus has triat?',fields:['t2']},
   {h:'<b>3.</b> Explica en una frase <b>per què</b> has triat aquest tipus de gràfica.',fields:['t3']}],
  fields:[{k:'t1',type:'select',label:'Has combinat cel·les per al títol?',opts:['Sí','No']},
   {k:'t2',type:'select',label:'Tipus de gràfica',opts:['Barres','Línies','Sectors']},
   {k:'t3',type:'text',label:'Per què aquest tipus de gràfica?'}]}},

'cd2-superior-4':{
 puc:['Sé quan ajuda una animació o una transició i quan distreu','Sé triar colors, lletra i quantitat de text perquè es vegi bé','Sé afegir animacions i transicions i justificar-ne l’ús'],
 lessons:[
  {t:'Animacions i transicions',h:`Una <b>transició</b> és l’efecte que es veu <b>quan canvies de diapositiva</b>.<br>Una <b>animació</b> fa que un element (títol, imatge) <b>aparegui o es mogui</b> dins la diapositiva.<br>Es poden afegir des del menú <b>Insereix</b> o <b>Diapositiva</b>.`,fig:()=>figTransicio()},
  {t:'Menys és més',h:`Ajuden quan <b>revelen un punt a poc a poc</b> i així el públic segueix el que expliques.<br>Distreuen quan són <b>massa</b>, <b>massa llargues</b> o no tenen relació amb el contingut.<br>Una bona regla: <b>com a màxim</b> un tipus de transició a tota la presentació.`},
  {t:'Que es vegi bé',h:`<b>Contrast</b>: text clar sobre fons fosc o text fosc sobre fons clar.<br><b>Mida de lletra</b>: es llegeix des de l’última fila de la classe, si no és massa gran.<br><b>Poques paraules</b> per diapositiva: idees, no paràgrafs.`,fig:()=>figContrast()},
  {t:'Presentar',h:`Una presentació és un <b>suport</b>: tu expliques i les diapositives <b>ajuden</b>. No llegeixis la diapositiva tal qual; afegeix el que no hi ha escrit.`}],
 items:[
  ch('V1','presav','Una <b>transició</b> és…',['l’efecte en canviar de diapositiva','una imatge','un tipus de lletra'],0,'Passes d’una a una altra.','La transició és l’efecte en passar d’una diapositiva a una altra.'),
  ch('V2','presav','Una animació <b>ajuda</b> quan…',['mostra els punts d’un en un mentre els expliques','fa botar tot sense motiu','és molt llarga'],0,'Va al ritme del que expliques.','Ajuda quan acompanya el que expliques.'),
  ch('V3','presav','Una presentació té <b>cinc tipus de transicions</b> diferents. Què és probable?',['Que distreguin l’atenció','Que s’entengui millor','Que sigui més curta'],0,'Menys és més.','Massa efectes distreuen del contingut.'),
  ch('V4','presav','Quin <b>color de text</b> es llegeix millor sobre fons blau fosc?',['Blanc','Blau marí','Verd fosc'],0,'Cal contrast.','El text clar sobre fons fosc es llegeix millor.'),
  ch('V5','presav','Una diapositiva té <b>tres paràgrafs llargs</b>. Què millorem?',['Posem idees clau, poques paraules','Posem la lletra més petita','Afegim més text'],0,'La diapositiva no és el discurs.','Convé usar idees clau i poques paraules.'),
  ch('V6','presav','Quan fas la presentació, el millor és…',['explicar amb les teves paraules i no llegir la diapositiva','llegir-la tal qual','no dir res'],0,'La diapositiva és suport.','Les diapositives són un suport: tu expliques.'),
  ch('V7','presav','Vols justificar una animació. Quina és una <b>bona raó</b>?',['Mostra els passos d’un procés un per un','Fa que quedi més bonic i prou','Em va semblar divertit'],0,'Ha de tenir un sentit.','Una animació ha de tenir una funció clara.')],
 sabers:{presav:{realDone:req(['v1','v2','v3'])}},
 real:{blocks:[
   {h:'<b>1.</b> A <b>Presentacions de Google</b>, crea una presentació de <b>quatre diapositives</b> sobre el teu tema. Cada una, amb una idea i poc text.',fields:['v1']},
   {h:'<b>2.</b> Afegeix <b>una animació</b> en un lloc on ajudi i <b>una sola transició</b> a tota la presentació.',fields:['v2']},
   {h:'<b>3.</b> Explica <b>per què</b> has posat aquesta animació.',fields:['v3']}],
  fields:[{k:'v1',type:'select',label:'Quantes diapositives té?',opts:['Quatre o més','Tres','Menys de tres']},
   {k:'v2',type:'select',label:'Què has afegit?',opts:['Una animació i una transició','Només animació','Només transició','Res']},
   {k:'v3',type:'text',label:'Per què aquesta animació?'}]}},

'cd2-superior-5':{
 fig:()=>figDispositius(),
 puc:['Sé importar un fitxer a un editor multimèdia','Sé fer una edició senzilla d’imatge, vídeo i àudio','Sé on guardar el producte final (núvol, local o memòria externa) i triar el programa'],
 lessons:[
  {t:'Importar a un editor',h:`<b>Importar</b> vol dir <b>portar</b> una foto, un vídeo o un àudio a l’editor des d’una carpeta, de la càmera o del núvol.<br>Fes servir el menú <b>Fitxer → Importa/Obre</b> o arrossega el fitxer a l’editor.`,fig:()=>figFluxEdicio()},
  {t:'Edició senzilla',h:`<b>Imatge</b>: retallar, redimensionar, girar, ajustar la llum.<br><b>Vídeo</b>: retallar clips, ordenar-los, afegir text, música o una veu.<br><b>Àudio</b>: retallar la pista, baixar o pujar el volum.<br>Edita només el que és <b>necessari</b>.`},
  {t:'Exportar i guardar el producte final',h:`<b>Exportar</b> és <b>crear el fitxer final</b> a partir de l’editor.<br>Pots guardar-lo:<br>☁️ al <b>núvol</b> (el pots obrir des de qualsevol lloc);<br>💻 en <b>local</b>, a l’ordinador;<br>💾 en una <b>memòria externa</b> (llapis de memòria, disc dur).<br>Un consell: té <b>dues còpies</b> del que és important.`,fig:()=>figNuvolLocal()},
  {t:'Triar el programa',h:`Per editar pots fer servir programes <b>lliures i gratuïts</b> (com <b>Audacity</b> o <b>GIMP</b>) o <b>de pagament</b> (que cal comprar). Abans de triar, pensa en:<br>💶 el <b>cost</b> i la <b>llicència</b>;<br>🏠 si el pots <b>instal·lar a casa</b>;<br>🔁 si el <b>fitxer s’obre</b> en altres programes.`}],
 items:[
  ch('M1','multi','<b>Importar</b> un fitxer a un editor vol dir…',['portar-lo a l’editor per treballar-hi','esborrar-lo','imprimir-lo'],0,'Portem el fitxer cap a dins.','Importar és portar el fitxer a l’editor.'),
  ch('M2','multi','Per <b>treure el principi i el final</b> d’un vídeo, fas…',['retallar el clip','girar','canviar el color'],0,'Treiem el que sobra.','Retallar el clip elimina parts del vídeo.'),
  ch('M3','multi','<b>Exportar</b> és…',['crear el fitxer final','esborrar els originals','obrir un fitxer'],0,'Després de l’edició.','Exportar crea el fitxer final.'),
  ch('M4','multi','Vols tenir un vídeo important <b>segur</b>. Què fas?',['El guardo en dos llocs (per exemple, núvol i memòria externa)','El deixo només en un ordinador compartit','No el guardo'],0,'Les còpies protegeixen.','Dues còpies eviten perdre el treball.'),
  ch('M5','multi','Vols editar àudio gratuïtament a casa. Què mires primer?',['Si el programa és lliure o gratuït i es pot instal·lar','Només el nom','Que sigui car'],0,'Cost i instal·lació.','Convé mirar el cost, la llicència i si es pot instal·lar.'),
  ch('M6','multi','Un programa lliure com <b>Audacity</b> és…',['gratuït i es pot instal·lar a casa','de pagament','només per a escoles'],0,'No cal comprar-lo.','Audacity és lliure i gratuït.'),
  ch('M7','multi','Per què convé <b>editar només el necessari</b>?',['Perquè així es manté clar i es treballa més ràpid','Perquè està prohibit fer més','Perquè no cal revisar'],0,'Menys és més.','Editar només el necessari fa el producte més clar.'),
  {id:'M8',saber:'multi',type:'ordre',prompt:'<b>Ordena els passos</b> per treballar amb un àudio.',steps:['L’exporto','L’importo a l’editor','El guardo en dos llocs','El retallo'],order:[1,3,0,2],hint:'Primer cal portar-lo a l’editor.',expl:'Importar, retallar, exportar i guardar en dos llocs.'}],
 sabers:{multi:{realDone:req(['m1','m2','m3'])}},
 real:{blocks:[
   {h:'<b>1.</b> <b>Importa</b> una foto, un vídeo o un àudio del teu tema a un editor (el que us indiqui el professorat). Què has importat?',fields:['m1']},
   {h:'<b>2.</b> <b>Edita’l de manera senzilla</b> (retalla, redimensiona o ajusta el volum) i guarda’l. Què has fet?',fields:['m2']},
   {h:'<b>3.</b> On has guardat el producte final i <b>amb quin programa</b> l’has fet? Era lliure o de pagament?',rows:[['m3','m4']],fields:[]}],
  fields:[{k:'m1',type:'select',label:'Què has importat?',opts:['Una foto','Un vídeo','Un àudio']},
   {k:'m2',type:'select',label:'Quina edició has fet?',opts:['Retallar','Redimensionar','Ajustar volum','Una altra']},
   {k:'m3',type:'select',label:'On l’has guardat?',opts:['Al núvol','En local','En una memòria externa','En dos llocs']},
   {k:'m4',type:'select',label:'El programa és…',opts:['Lliure o gratuït','De pagament','No ho sé']}]}},

'cd2-superior-6':{
 puc:['Sé decidir primer què vull transmetre i a qui','Sé triar el format més adient: text, taula, imatge, àudio, vídeo, esquema o mapa conceptual','Sé valorar la qualitat estètica d’una producció'],
 lessons:[
  {t:'Primer pensa què vols transmetre',h:`Abans de triar el format, pregunta’t:<br>❓ <b>Què</b> vull que s’entengui?<br>👥 <b>A qui</b> ho explico (companys, famílies, nens petits)?<br>Segons la resposta, el format és un altre: un nen petit entén millor una imatge; una persona gran potser prefereix un text més gran.`},
  {t:'Triar el format',h:`📝 <b>Text</b>: explicacions i raonaments.<br>▦ <b>Taula</b>: comparar dades.<br>🖼️ <b>Imatge</b>: mostrar com és una cosa.<br>🔊 <b>Àudio</b>: entrevistes, música, relats.<br>🎞️ <b>Vídeo</b>: processos i accions.<br>🧩 <b>Esquema o mapa conceptual</b>: relacions entre idees.<br>Cap no és «millor» sempre: <b>depèn</b> del que vols explicar.`,fig:()=>figFormats()},
  {t:'Mapes conceptuals',h:`Un <b>mapa conceptual</b> posa les idees en <b>caixes</b> unides per <b>fletxes amb paraules</b> que expliquen la relació («es menja», «viu a»).<br>Hi ha aplicacions per fer-los fàcilment. Ajuden a estudiar i a veure l’estructura d’un tema.`,fig:()=>figMapa()},
  {t:'Cura estètica',h:`Una bona producció té:<br>🎨 <b>colors</b> que combinen i es llegeixen;<br>📐 una <b>composició</b> ordenada (res amuntegat);<br>📸 <b>imatges</b> nítides i <b>àudios</b> sense soroll.<br>Una producció cuidada demostra respecte per qui la mira.`}],
 items:[
  ch('E1','format','Abans de triar el format, el més important és pensar…',['què vols transmetre i a qui','quin color triar','quant dura el vídeo'],0,'El format ve després.','Primer el missatge i el públic; després, el format.'),
  ch('E2','format','Vols mostrar <b>com es fa</b> un procés (per exemple, com neixen els llops). Què és millor?',['Un vídeo','Una taula','Un àudio'],0,'Mostra moviment.','El vídeo mostra processos amb moviment.'),
  ch('E3','format','Vols <b>comparar</b> tres animals amb dades. Què és millor?',['Una taula','Un àudio','Una imatge'],0,'Cal comparar.','Una taula compara dades.'),
  ch('E4','format','Vols mostrar com es <b>relacionen</b> els elements d’un ecosistema. Què és millor?',['Un mapa conceptual','Un àudio','Una foto'],0,'Relacions entre idees.','Un mapa conceptual mostra relacions.'),
  ch('E5','format','Una entrevista a una persona gran del poble queda millor en…',['àudio o vídeo','taula','esquema'],0,'La veu té valor.','L’àudio o el vídeo conserven la veu.'),
  ch('E6','format','Una presentació té <b>textos amuntegats</b> i colors que no es llegeixen. Quin aspecte falla?',['La cura estètica i la composició','El tema','El fitxer'],0,'Pensa en l’ordre i el contrast.','La composició i els colors són part de la qualitat.'),
  ch('E7','format','Expliques el mateix tema a nens de P4 i a adults. Què canvia?',['El format i el nivell, segons a qui ho expliques','Res: sempre igual','El nom del fitxer'],0,'Hem de pensar en el públic.','El públic condiciona el format i el nivell.'),
  ch('E8','format','Dos companys expliquen el mateix amb una taula i un vídeo. Quin és «millor»?',['Depèn del que volen transmetre','Sempre el vídeo','Sempre la taula'],0,'No hi ha una resposta única.','El format adequat depèn del missatge i del públic.')],
 sabers:{format:{realDone:req(['e1','e2','e3'])}},
 real:{blocks:[
   {h:'<b>1.</b> Escriu en una frase <b>què vols transmetre</b> sobre el teu tema i <b>a qui</b>.',fields:['e1']},
   {h:'<b>2.</b> Tria <b>el format</b> que et sembla millor i explica <b>per què</b>.',rows:[['e2','e3']],fields:[]}],
  fields:[{k:'e1',type:'text',label:'Què vull transmetre i a qui'},
   {k:'e2',type:'select',label:'Format triat',opts:['Text','Taula','Imatge','Àudio','Vídeo','Esquema o mapa conceptual']},
   {k:'e3',type:'text',label:'Per què aquest format?'}]}},

'cd2-superior-7':{
 puc:['Sé qui és l’autor o l’autora d’un contingut','Sé citar un text i una imatge amb autoria, adreça i data de consulta','Sé posar el meu nom a la meva producció i citar les fonts que he fet servir'],
 lessons:[
  {t:'Qui és l’autor o l’autora?',h:`Tot contingut (text, foto, vídeo, so) té <b>una autoria</b>: algú l’ha fet.<br>Quan el fem servir en el nostre treball hem de <b>reconèixer-ho</b>: dir qui l’ha fet i d’on l’hem tret. A CD1 ho vas veure en mirar les fonts consultades.`},
  {t:'Citar un text i una imatge',h:`Una <b>cita</b> bona té:<br>👤 l’<b>autoria</b> (persona o entitat);<br>📄 el <b>títol</b> de la pàgina;<br>🔗 l’<b>adreça</b> web;<br>📅 la <b>data de consulta</b> (el dia que l’has mirada).<br>Exemple: <i>Pep Soler. «Els llops». Viquipèdia. https://… (consulta: 24/11/2026).</i><br>Per a una imatge, el mateix: autoria, lloc d’on l’has agafada i data.`,fig:()=>figCita()},
  {t:'La nostra autoria',h:`També has d’<b>escriure el teu nom</b> a la teva producció: ets autor o autora del que has creat.<br>A més, dona les <b>gràcies</b> a les fonts que has fet servir amb una llista al final: les <b>fonts consultades</b>.`},
  {t:'Per què citem?',h:`Citem perquè:<br>1. Respectem el <b>treball dels altres</b>.<br>2. Qui ens llegeix pot <b>comprovar</b> el que diem i veure si és fiable.<br>3. Mostrem què és <b>nostre</b> i què hem pres d’altres persones.`}],

/* Reparteix la posició de la resposta correcta de les preguntes d’opció múltiple de CD2

Object.keys(CONTENT).filter(k=>k.startsWith('cd2-')).forEach(k=>{
  CONTENT[k].items.forEach((it,n)=>{
    if(it.type!=='choice')return;
    const len=it.opts.length,shift=(n+k.length)%len;
    if(!shift)return;
    it.opts=it.opts.map((_,i)=>it.opts[(i-shift+len)%len]);
    it.ok=(it.ok+shift)%len;
  });
});

function saberState(k,cs,sab){
  const its=cs.items.filter(i=>i.saber===sab.id);
  const r=S.res[k]||{};
  const done=its.filter(i=>r[i.id]&&r[i.id].done).length;
  if(!done)return{st:'no',done:0,n:its.length};
  const c=its.filter(i=>r[i.id]&&r[i.id].first===true).length;
  const pct=c/its.length;
  const hints=its.some(i=>r[i.id]&&r[i.id].hint);
  const realOk=!!cs.sabers[sab.id].realDone(S.real[k]||{});
  let st='proces';
  if(done===its.length&&pct>=.7)st='assolit';
  if(done===its.length&&pct>=.9&&!hints&&realOk)st='dominat';
  return{st,pct,c,n:its.length,done,hints,realOk};
}
function sessionStatus(k){
  const cs=CONTENT[k];if(!cs)return null;
  const s=sessOf(k);const sts=s.sabers.map(sb=>saberState(k,cs,sb).st);
  if(sts.every(x=>x==='no'))return'no';
  return sts.every(x=>x==='assolit'||x==='dominat')?'fet':'proces';
}

      +`</div>`;
    }else{
      h+=bubble('Ara toca cercar de debò!')+`<div class="card hl"><h3>🔎 Practiquem</h3><p>${cs.real.intro}</p>
      <p><a class="btn big" href="${SEARCH_URL}" target="_blank" rel="noopener" data-act="opened">🔎 Obre el cercador (pestanya nova)</a></p></div>`;
    }
    if(S.back)h+=`<div class="back">${blk?'👋 Ja sou aquí! Continueu amb les respostes.':'👋 Ja has tornat! Omple el quadre de sota amb el que has fet.'}</div>`;
    if(!blk)h+=`<div class="card" id="realform"><h3>📝 El que he fet</h3>${cs.real.fields.map(f=>fieldH(f)).join('')}</div>`;
    h+=`<p><button class="btn sec" data-act="prev">← Enrere</button> <button class="btn big" data-act="next">Següent →</button></p>`;
  }else{
    if(ini){
      h+=profNota('Dirigiu una autoavaluació conjunta: llegiu cada definició, comproveu que el grup la pot explicar amb altres paraules i pregunteu com es veu ara. Marqueu el semàfor segons el consens. Compareu-ho amb el punt de partida de la primera pestanya.')+`<h3>${docentMode()?'Què hem après?':'Què he après?'}</h3>`;
      h+=figH;
      const used=(cs.defs||[]).map(d=>d.p);
      h+=(cs.defs||[]).map(d=>`<div class="card hl"><h3>${d.t} ${spBtn(d.t+'. '+d.h)}</h3><div>${fx(d.h)}</div>${emoOne('post',d.p,['Ho sé explicar','Una mica','Encara no'])}</div>`).join('');
      h+=cs.puc.map((p,i)=>used.includes(i)?'':emoCard('post',i)).join('');
    }else{
      h+=bubble('Molt bé! Mira com et veus ara i després ensenya l’estat al professorat.')+emo('post');
    }
    h+=`<p><button class="btn big" data-act="go" data-v="estat">📋 Estat</button> <button class="btn sec" data-act="go" data-v="menu">← Sessions</button></p>`;
  }
  return h;
}
function vPractica(k,cs){
  const items=cs.items,n=items.length;
  if(S.item>=n)return isIni()?bubble('Hem acabat de repassar! 🎉')+`<div class="card"><p>Ara, a la pissarra digital, convideu diferents alumnes a fer proves pràctiques.</p><button class="btn sec" data-act="restart">Repassar de nou</button> <button class="btn big" data-act="next">Practiquem →</button></div>`:bubble('Has acabat la pràctica! 🎉')+`<div class="card"><p>Ara passarem a cercar de debò.</p><button class="btn sec" data-act="restart">Repetir la pràctica</button> <button class="btn big" data-act="next">Practiquem →</button></div>`;
  const it=items[S.item],r=(S.res[k]=S.res[k]||{}),ir=(r[it.id]=r[it.id]||{first:null,hint:false,done:false});
  let h=(isIni()&&S.item===0?profNota('Projecteu cada pregunta i deixeu que el grup en debati la resposta abans de seleccionar-la. Si no és correcta, aprofiteu l’error per tornar a explicar el concepte; també hi ha disponible la pista. Si us sembla, podeu demanar a diferents alumnes que vinguin a la pissarra a marcar la resposta.'):'')+`<div class="prog"><i style="width:${S.item/n*100}%"></i></div><p style="margin:6px 0"><small>Pregunta ${S.item+1} de ${n}</small></p>`;
  const need=it.type==='words'?it.correct.length:0;
  const pr=it.type==='words'?`Vols respondre aquesta pregunta: <i>«${esc(it.words.join(' ')+it.end)}»</i><br>Toca les <b>${need} paraules clau</b> que escriuries al cercador.`:it.prompt;
  let body=`<div style="margin-bottom:6px">${fx(pr)} ${spBtn(pr)}</div>`;
  if(it.html&&it.type==='choice')body+=it.html;
  if(it.type==='words'){
    body=`<div class="toy"><div class="bar"><span class="dots"><span></span><span></span><span></span></span><span class="url">🔎 Paraules clau per cercar…</span></div><div class="body">${body}<div style="font-size:23px;margin-top:8px">${it.words.map((w,i)=>{const sel=S.tok.includes(i);const good=it.correct.includes(w.toLowerCase());return `<button class="tok ${ir.done?(good?'ok':''):sel?'sel':''}" data-act="tok" data-i="${i}" ${ir.done?'disabled':''}>${esc(w)}</button>`}).join('')}${esc(it.end)}</div></div></div>`;
    if(!ir.done)body+=`<p><button class="btn" data-act="check" ${S.tok.length===need?'':'disabled'}>Comprova</button> <span style="color:var(--mut)">Has triat ${S.tok.length} de ${need}</span></p>`;
  }else if(it.type==='clic'){
    body+=`<div class="${ir.done?'locked':''}">${it.html}</div>`+(ir.done?`<style>.toy [data-id="${it.target}"]{outline:3px solid var(--ok);border-radius:8px}.toy [data-id="${it.target}"] rect{stroke:var(--ok)!important;stroke-width:5!important}</style>`:'');
  }else if(it.type==='ordre'){
    body+=it.steps.map((t,i)=>{const p=S.ord.indexOf(i);return `<button class="opt ord ${p>=0?'sel':''}" data-act="ord" data-i="${i}" ${ir.done?'disabled':''}>${p>=0?`<span class="n">${p+1}</span>`:''}${fx(esc(t))}</button>`}).join('');
    if(!ir.done)body+=`<p><button class="btn" data-act="check" ${S.ord.length===it.steps.length?'':'disabled'}>Comprova</button> <button class="btn sec" data-act="ordreset">Torna a començar</button></p>`;
  }else{
    body+=it.opts.map((o,i)=>{const bad=(S.fb&&S.fb.bad||[]).includes(i);const good=ir.done&&i===it.ok;return `<button class="opt ${good?'ok':bad?'ko':''}" data-act="opt" data-i="${i}" ${ir.done?'disabled':''}>${fx(esc(o))}</button>`}).join('');
  }
  if(S.hint)body+=`<div class="fb hint">💡 ${fx(esc(it.hint))}</div>`;
  if(S.fb&&S.fb.msg)body+=`<div class="fb ${S.fb.ok?'ok':'ko'}">${S.fb.ok?'✅ ':'❌ '}${S.fb.msg}</div>`;
  if(!ir.done)body+=`<p><button class="btn sec" data-act="hint">💡 Pista</button></p>`;
  else body+=`<p><button class="btn big" data-act="nextitem">${S.item===n-1?'Acabar':'Següent'} →</button></p>`;
  return h+`<div class="card hl">${body}</div><p><button class="btn sec" data-act="prev">← Enrere</button></p>`;
}
function realScore(k,cs){const r=S.real[k]||{};const fs=(cs.real.fields||[]).filter(f=>f.ok!==undefined||f.okFn);if(!fs.length)return null;return{c:fs.filter(f=>f.okFn?!!f.okFn(r[f.k]||'',r):r[f.k]===f.ok).length,n:fs.length}}
function summaryText(k,cs){
  const s=sessOf(k);
  return s.sabers.map(sb=>{const q=saberState(k,cs,sb);const sc=realScore(k,cs);return `${sb.text.split(' (')[0]}: ${ST_LAB[q.st]}${q.n&&q.done?` (${Math.round(q.pct*100)}%${q.hints?', amb pistes':''}${q.st==='dominat'?', pendent de confirmar':''}${sc?`, pràctica ${sc.c}/${sc.n} correctes`:''})`:''}`}).join(' | ');
}
function realAnswers(k,cs){
  const r=S.real[k]||{};
  const order=cs.real.blocks?cs.real.blocks.flatMap(b=>(b.rows||[]).flat().concat(b.fields||[])):(cs.real.fields||[]).map(f=>f.k);
  const fb=Object.fromEntries((cs.real.fields||[]).map(f=>[f.k,f]));
  return order.filter(x=>fb[x]).map(x=>{const f=fb[x],v=(r[x]||'').trim();let mark='';if(v&&(f.okFn||f.ok!==undefined)){mark=(f.okFn?!!f.okFn(v,r):v===f.ok)?' ✅':' ❌'}return{q:f.label,a:v,mark}});
}
function vEstat(){
  const d=new Date().toLocaleDateString('ca-ES');
  const c=CICLES[S.cicle];
  const keys=SESSIONS[S.cicle].map(s=>skey(S.cicle,s.id)).filter(k=>CONTENT[k]&&((sessionStatus(k)&&sessionStatus(k)!=='no')||Object.values(S.real[k]||{}).some(v=>String(v).trim())));
  let h=header(`<span class="noprint"></span>`)+`<h2>📋 Estat</h2><div class="card hl"><table>
    <tr><th>${docentMode()?'Sessió':'Alumnat'}</th><td>${esc(quiTxt())}</td></tr>
    <tr><th>Nivell</th><td>${c.nom} (${c.cursos})</td></tr>${S.tema.trim()?`<tr><th>Tema</th><td>${esc(S.tema)}</td></tr>`:''}<tr><th>Data</th><td>${d}</td></tr></table></div>`;
  if(!keys.length)h+=`<div class="card">Encara no has fet cap activitat.</div>`;
  let txt='';
  keys.forEach(k=>{
    const cs=CONTENT[k],s=sessOf(k),self=S.self[k]||{pre:[],post:[]};
    h+=`<div class="card"><h3>Sessió ${s.id}. ${esc(s.titol)}</h3><table><tr><th>Saber</th><th>Estat</th><th>Detall</th></tr>`+
    s.sabers.map(sb=>{const q=saberState(k,cs,sb);
      const det=q.done?`${q.c} de ${q.n} bé a la primera (${Math.round(q.pct*100)}%)<br>${q.hints?'Ha fet servir pistes':'Sense pistes'} · ${q.realOk?'Fitxa de cerca feta':'Falta la cerca real'}${(()=>{const sc=realScore(k,cs);return sc?` · Pràctica: ${sc.c} de ${sc.n} respostes correctes`:''})()}${q.st==='dominat'?'<br>☐ Confirmat pel docent':''}`:'';
      return `<tr><td>${esc(sb.text)} <small>(${sb.ca})</small></td><td class="st ${q.st}">${ST_LAB[q.st]}</td><td><small>${det}</small></td></tr>`}).join('')+`</table>`;
    const pre=self.pre,post=self.post,E=['','🔴','🟡','🟢'];
    if(pre.length||post.length)h+=`<p><small>Com es veu: abans ${pre.map(v=>E[v]||'·').join(' ')} → després ${post.length?post.map(v=>E[v]||'·').join(' '):'(encara no)'}</small></p>`;
    const ra=realAnswers(k,cs);
    h+=`<h4 style="margin:14px 0 6px">📝 Respostes de la pràctica</h4>`+(ra.some(x=>x.a)?`<table class="resp"><tr><th>Pregunta</th><th>Resposta</th></tr>${ra.map(x=>`<tr><td><small>${fx(x.q)}</small></td><td>${x.a?esc(x.a)+x.mark:'<small style="color:var(--mut)">— sense resposta —</small>'}</td></tr>`).join('')}</table>`:`<p><small>Encara no hi ha respostes a la pràctica.</small></p>`);
    h+=`</div>`;
    txt+=`${quiTxt()} · ${c.nom} · Sessió ${s.id} · ${d}${S.tema.trim()?' · Tema: '+S.tema:''} · ${summaryText(k,cs)}\n`+(ra.some(x=>x.a)?'   Respostes de la pràctica:\n'+ra.filter(x=>x.a).map(x=>`   - ${x.q.replace(/<[^>]+>/g,'')}: ${x.a}`).join('\n')+'\n':'');
  });
  window.__txt=txt;
  h+=`<div class="card noprint" style="font-size:16px"><b>Com es calcula l’estat de cada saber</b>
  <p style="margin:6px 0">Es compten només les preguntes encertades <b>a la primera</b>.</p>
  <table>
   <tr><td class="st no">○ No fet</td><td>Encara no ha fet cap pregunta d’aquest saber.</td></tr>
   <tr><td class="st proces">🔄 En procés</td><td>Ha fet preguntes, però no ha encertat a la primera 7 de cada 10, o encara no les ha acabades totes.</td></tr>
   <tr><td class="st assolit">✔ Assolit</td><td>Ha acabat les preguntes i n’ha encertat a la primera <b>7 de cada 10 o més</b>. Pot haver fet servir pistes (és a dir, ho fa amb ajuda).</td></tr>
   <tr><td class="st dominat">⭐ Dominat</td><td>Ha encertat a la primera <b>9 de cada 10 o més</b>, <b>sense cap pista</b>, i ha fet la cerca real (fitxa). L’app només ho proposa: el docent ho confirma marcant la casella ☐.</td></tr>
  </table></div>
  <p class="noprint"><button class="btn" data-act="copy">📎 Copia el resum</button> <button class="btn sec" data-act="go" data-v="menu">← Torna a les sessions</button></p><div id="copied" class="noprint"></div>`;
  return h;
}
/* Barra de navegació: camí clicable (Inici › Primària › CD › Cicle › Sessió) i dos botons fixos (Sessions i Estat) */
function navBar(){
  const sc=S.screen;
  if(sc==='portada')return '';
  const n=NIVELLS[S.nivell],c=CICLES[S.cicle];
  const it=[['portada','🏠 Inici','Torna a la portada'],['nivell',n.nom,'Tria la competència']];
  if(['inici','menu','sessio','estat'].includes(sc))it.push(['inici',S.cd,COMP[S.cd].titol+': canvia de nivell']);
  if(['menu','sessio','estat'].includes(sc))it.push(['menu',c.nom,'Llista de sessions']);
  if(sc==='sessio')it.push([null,'Sessió '+sessOf(S.sk).id]);
  if(sc==='estat')it.push([null,'Estat']);
  const last=it.length-1;
  const crumbs=it.map(([v,t,tt],i)=>i===last?`<li><span class="cur" aria-current="page">${esc(t)}</span></li>`:`<li><button class="crumb" data-act="go" data-v="${v}" title="${esc(tt||'')}">${esc(t)}</button></li>`).join('');
  const acts=['menu','sessio','estat'].includes(sc)?`<div class="navb"><button class="btn sec ${sc==='menu'?'on':''}" data-act="go" data-v="menu">☰ Sessions</button><button class="btn sec ${sc==='estat'?'on':''}" data-act="go" data-v="estat">📋 Estat</button></div>`:'';
  return `<nav class="nav noprint" aria-label="Camí de navegació"><ol class="crumbs">${crumbs}</ol>${acts}</nav>`;
}
function render(){
  document.body.dataset.c=S.cicle;
  const v={portada:vPortada,nivell:vNivell,inici:vInici,menu:vMenu,sessio:vSessio,estat:vEstat}[S.screen];
  $app.innerHTML=fmtBar()+navBar()+v();
  applyFmt();
  window.scrollTo(0,0);
}

/* ============ EVENTS ============ */
function setPath(p,v){const a=p.split('.');let o=S;for(let i=0;i<a.length-1;i++){o=o[a[i]]=o[a[i]]||{}}o[a[a.length-1]]=v}
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)setPath(k,e.target.value)});
document.addEventListener('change',e=>{const d=e.target.dataset||{};
  if(d.k){setPath(d.k,e.target.value);if(d.rr)render()}
  if(d.chk){const v=[...document.querySelectorAll('input[data-chk="'+d.chk+'"]:checked')].map(x=>x.value).join(', ');setPath(d.chk,v)}
  if(d.fmt){if(d.fmt==='maj')S.fmt.maj=e.target.checked;else S.fmt.font=e.target.value;applyFmt()}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.screen==='sessio'&&S.step===3&&S.opened){S.back=true;render();const f=document.getElementById('realform');if(f)f.scrollIntoView({behavior:'smooth'})}});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,d=b.dataset;
  const k=S.sk,cs=k&&CONTENT[k];
  if(a==='speak'){speak(d.t);return}
  if(a==='opened'){S.opened=true;return}
  const mark=(it,ir,ok,okMsg,koMsg,bad)=>{if(ir.first===null)ir.first=ok;if(ok){ir.done=true;S.fb={ok:true,msg:fx(okMsg)}}else S.fb={ok:false,msg:koMsg,bad:bad||[]};render()};
  if(a==='cicle'){S.cicle=d.v;render()}
  else if(a==='start'){const need=isIni()?(S.us==='alumnat'&&!S.n1.trim()):!S.n1.trim();if(need){S.err='Escriu el teu nom per començar.';render();return}S.err='';S.screen='menu';render()}
  else if(a==='nivell'){S.nivell=d.v;S.screen='nivell';render()}
  else if(a==='cd'){useCD(d.v);S.screen='inici';render()}
  else if(a==='enviaContacte'){enviaContacte()}
  else if(a==='go'){S.screen=d.v;render()}
  else if(a==='open'){S.sk=skey(S.cicle,d.i);S.screen='sessio';S.step=0;S.item=0;resetQ();S.back=false;S.opened=false;render()}
  else if(a==='step'){S.step=+d.v;resetQ();render()}
  else if(a==='next'){S.step=Math.min(4,S.step+1);resetQ();render()}
  else if(a==='prev'){S.step=Math.max(0,S.step-1);render()}
  else if(a==='restart'){S.item=0;S.res[k]={};resetQ();render()}
  else if(a==='self'){const s=S.self[k]||(S.self[k]={pre:[],post:[]});s[d.g][+d.i]=+d.v;render()}
  else if(a==='tok'){const i=+d.i;S.tok=S.tok.includes(i)?S.tok.filter(x=>x!==i):[...S.tok,i];S.fb=null;render()}
  else if(a==='ord'){const i=+d.i,p=S.ord.indexOf(i);S.ord=p>=0?S.ord.slice(0,p):[...S.ord,i];S.fb=null;render()}
  else if(a==='ordreset'){S.ord=[];S.fb=null;render()}
  else if(a==='hint'){const it=cs.items[S.item];S.res[k][it.id].hint=true;S.hint=true;render()}
  else if(a==='check'){
    const it=cs.items[S.item],ir=S.res[k][it.id];
    let ok;
    if(it.type==='ordre')ok=S.ord.length===it.order.length&&S.ord.every((x,i)=>x===it.order[i]);
    else{const sel=S.tok.map(i=>it.words[i].toLowerCase()).sort(),cor=it.correct.map(x=>x.toLowerCase()).sort();ok=sel.length===cor.length&&sel.every((x,i)=>x===cor[i])}
    mark(it,ir,ok,esc(it.expl),it.type==='ordre'?'Gairebé! Torna-ho a provar.':'Gairebé! Torna-ho a provar (pots fer servir la pista).')}
  else if(a==='opt'){const it=cs.items[S.item],ir=S.res[k][it.id],i=+d.i;mark(it,ir,i===it.ok,esc(it.expl),'Torna-ho a provar.',[...((S.fb&&S.fb.bad)||[]),i])}
  else if(a==='clic'){const it=cs.items[S.item],ir=S.res[k][it.id];if(ir.done)return;mark(it,ir,d.id===it.target,esc(it.expl),'Aquest no és. Torna-ho a provar.')}
  else if(a==='nextitem'){S.item++;resetQ();render()}
  else if(a==='copy'){const t=window.__txt||'';const m=document.getElementById('copied');
    try{navigator.clipboard.writeText(t).then(()=>{m.innerHTML='<div class="fb ok">Resum copiat. Enganxa’l a la plantilla.</div>'},()=>{m.innerHTML='<div class="fb hint">No s’ha pogut copiar. Selecciona el text:<br><textarea rows="4" readonly>'+esc(t)+'</textarea></div>'})}
    catch(err){m.innerHTML='<div class="fb hint"><textarea rows="4" readonly>'+esc(t)+'</textarea></div>'}}
});
async function enviaContacte(){
  const c=S.c;
  if(!c.msg.trim()){S.cstat={ok:false,msg:'Escriu un missatge abans d’enviar-lo.'};render();return}
  const dades={nom:c.nom.trim(),email:c.email.trim(),tipus:c.tipus,missatge:c.msg.trim(),eina:'Competència digital (CDA-app)'};
  if(CONTACTE.endpoint){
    try{
      const r=await fetch(CONTACTE.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(dades)});
      if(r.ok){S.c={nom:'',email:'',tipus:'Suggeriment',msg:''};S.cstat={ok:true,msg:'Gràcies! Hem rebut el teu missatge.'}}
      else S.cstat={ok:false,msg:'No s’ha pogut enviar el missatge. Torna-ho a provar més tard.'};
    }catch(err){S.cstat={ok:false,msg:'No s’ha pogut enviar el missatge. Comprova la connexió i torna-ho a provar.'}}
    render();return;
  }
  if(CONTACTE.email){
    const cos=dades.missatge+'\n\n— '+(dades.nom||'Sense nom')+(dades.email?' ('+dades.email+')':'');
    const a=document.createElement('a');
    a.href='mailto:'+CONTACTE.email+'?subject='+encodeURIComponent('['+dades.tipus+'] Competència digital')+'&body='+encodeURIComponent(cos);
    document.body.appendChild(a);a.click();a.remove();
    S.cstat={ok:true,msg:'S’ha obert el teu programa de correu amb el missatge preparat. Prem «Envia» allà per acabar. Si no s’ha obert, escriu-nos directament a '+CONTACTE.email+'.'};render();return;
  }
  S.cstat={ok:false,msg:'El formulari encara no està configurat.'};render();
}
render();
